<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة إدارة العيادة</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="site-theme.css"><link rel="stylesheet" href="site-enhancements.css"><style>body{font-family:Tahoma,Arial;background:#f5f8f9}.admin{max-width:1100px;margin:50px auto;padding:20px}.panel{background:#fff;border:1px solid #e1eaed;border-radius:18px;padding:24px;margin:16px 0}.admin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.admin a{color:#064b7c}.login input{width:100%;padding:12px;margin:6px 0;border:1px solid #dbe5e9;border-radius:9px}.login button{padding:11px 18px;background:#4c963d;color:#fff;border:0;border-radius:9px}@media(max-width:700px){.admin-grid{grid-template-columns:1fr}}</style></head><body><main class="admin"><h1>لوحة إدارة العيادة</h1><div id="auth" class="panel login"><h2>تسجيل الدخول</h2><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><button id="login">دخول</button><p id="msg"></p></div><div id="dashboard" hidden><div class="admin-grid"><div class="panel"><h3>الحالات المرضية</h3><p>إدارة المحتوى من جدول diseases.</p></div><div class="panel"><h3>المقالات</h3><p>إدارة articles.</p></div><div class="panel"><h3>الخدمات</h3><p>إدارة services.</p></div><div class="panel"><h3>الوسائط</h3><a href="media-library.html">فتح مكتبة الوسائط</a></div><div class="panel"><h3>الحجوزات</h3><p>متابعة الطلبات حسب الصلاحيات.</p></div><div class="panel"><h3>الإعدادات</h3><p>ساعات العمل والتواصل وSEO.</p></div></div><button id="logout">تسجيل الخروج</button></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const A=document.getElementById('auth'),D=document.getElementById('dashboard'),M=document.getElementById('msg');async function state(){const {data}=await supabaseClient.auth.getSession();A.hidden=!!data.session;D.hidden=!data.session}document.getElementById('login').onclick=async()=>{M.textContent='جارٍ التحقق...';const {error}=await supabaseClient.auth.signInWithPassword({email:email.value,password:password.value});M.textContent=error?'تعذر تسجيل الدخول. تحقق من البيانات.':'';state()};document.getElementById('logout').onclick=async()=>{await supabaseClient.auth.signOut();state()};state()</script></body></html>
