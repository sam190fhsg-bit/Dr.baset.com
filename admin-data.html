<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>إدارة بيانات العيادة</title><link rel="stylesheet" href="site-theme.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f8fa;font-family:Tahoma,Arial;color:#17394d}.wrap{max-width:1200px;margin:auto;padding:18px}.top,.tabs,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.card{background:#fff;border:1px solid #dfe9ed;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 8px 24px rgba(0,50,75,.04)}.tabs{overflow:auto;flex-wrap:nowrap}.tabs button,.btn{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font:inherit;white-space:nowrap}.tabs button.active,.primary{background:#4c963d;color:#fff}.secondary{background:#e9f2f6;color:#064b7c}.danger{background:#fff0f0;color:#a32727}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.form input,.form textarea,.form select{width:100%;padding:11px;border:1px solid #d6e2e7;border-radius:9px;font:inherit;background:#fff}.form textarea{min-height:100px}.full{grid-column:1/-1}.list{display:grid;gap:10px}.row{border:1px solid #e1eaed;border-radius:12px;padding:12px;display:flex;justify-content:space-between;gap:12px;align-items:center}.row small{display:block;color:#667;margin-top:4px}.state{padding:18px;text-align:center;color:#667}.success{color:#39792f}.error{color:#a32727}.search{width:100%;padding:12px;border:1px solid #d6e2e7;border-radius:10px}.badge{background:#eef7eb;color:#39792f;padding:4px 8px;border-radius:20px;font-size:12px}@media(max-width:650px){.form{grid-template-columns:1fr}.full{grid-column:auto}.row{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><div class="top"><div><h1>إدارة بيانات العيادة</h1><p>الحالات المرضية والخدمات والمقالات والأسئلة والحجوزات.</p></div><a class="btn secondary" href="admin.html">العودة للوحة الإدارة</a></div><div id="gate" class="card">جارٍ التحقق من الصلاحية...</div><section id="app" hidden><div class="tabs" id="tabs"><button data-tab="diseases" class="active">الحالات المرضية</button><button data-tab="services">الخدمات</button><button data-tab="articles">المقالات</button><button data-tab="faqs">الأسئلة الشائعة</button><button data-tab="bookings">الحجوزات</button></div><div id="editor" class="card"></div><div class="card"><input id="search" class="search" placeholder="بحث في المحتوى..."><h2>السجلات الحالية</h2><div id="list" class="list"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let tab='diseases',rows=[];
const defs={
diseases:{title:'حالة مرضية',order:'sort_order',name:'title_ar',fields:[['slug','الرابط المختصر slug','text'],['category','التصنيف','text'],['title_ar','اسم الحالة','text'],['intro_ar','نبذة','textarea'],['causes_ar','الأسباب — اكتب كل سبب في سطر','jsonlines'],['symptoms_ar','الأعراض — اكتب كل عرض في سطر','jsonlines'],['diagnosis_ar','التشخيص','textarea'],['treatment_ar','خيارات العلاج العامة','textarea'],['tips_ar','نصائح — اكتب كل نصيحة في سطر','jsonlines'],['image_url','رابط الصورة','url'],['seo_title','عنوان SEO','text'],['seo_description','وصف SEO','textarea'],['sort_order','الترتيب','number'],['is_published','منشور','check']]},
services:{title:'خدمة',order:'sort_order',name:'title_ar',fields:[['slug','الرابط المختصر slug','text'],['title_ar','اسم الخدمة','text'],['short_description_ar','الوصف المختصر','textarea'],['body_ar','المحتوى','textarea'],['image_url','رابط الصورة','url'],['sort_order','الترتيب','number'],['is_published','منشور','check']]},
articles:{title:'مقال',order:'published_at',name:'title_ar',fields:[['slug','الرابط المختصر slug','text'],['title_ar','عنوان المقال','text'],['excerpt_ar','المقدمة المختصرة','textarea'],['body_ar','المحتوى','textarea'],['cover_url','صورة الغلاف','url'],['category','التصنيف','text'],['published_at','تاريخ النشر','datetime-local'],['is_published','منشور','check']]},
faqs:{title:'سؤال',order:'sort_order',name:'question_ar',fields:[['category','التصنيف','text'],['question_ar','السؤال','text'],['answer_ar','الإجابة','textarea'],['sort_order','الترتيب','number'],['is_published','منشور','check']]},
bookings:{title:'حجز',order:'created_at',name:'full_name',booking:true,fields:[['status','حالة الحجز','status'],['notes','ملاحظات','textarea']]}}
async function init(){const {data:{session}}=await supabaseClient.auth.getSession();if(!session){$('gate').innerHTML='يجب <a href="admin.html">تسجيل الدخول</a> أولًا.';return}const {data:ok,error}=await supabaseClient.rpc('is_content_editor');if(error||ok!==true){$('gate').textContent='لا توجد صلاحية لإدارة المحتوى.';return}$('gate').hidden=true;$('app').hidden=false;renderForm();load()}
function renderForm(x={}){const d=defs[tab];if(d.booking&& !x.id){$('editor').innerHTML='<h2>الحجوزات</h2><p>اختر «تعديل» لتحديث حالة الحجز أو الملاحظات. بيانات المرضى لا تُعرض في الموقع العام.</p>';return}const fields=d.fields.map(([k,l,t])=>{let v=x[k]??'';if(t==='jsonlines'){if(Array.isArray(v))v=v.join('\n');else if(v&&typeof v==='object')v=JSON.stringify(v,null,2);return `<textarea class="full" data-k="${k}" data-type="jsonlines" placeholder="${l}">${esc(v)}</textarea>`}if(t==='textarea')return `<textarea class="full" data-k="${k}" placeholder="${l}">${esc(v)}</textarea>`;if(t==='check')return `<label><input data-k="${k}" type="checkbox" ${v===true||(!x.id&&k==='is_published')?'checked':''}> ${l}</label>`;if(t==='status')return `<select data-k="${k}"><option value="NEW">جديد</option><option value="CONTACTED">تم التواصل</option><option value="CONFIRMED">مؤكد</option><option value="COMPLETED">مكتمل</option><option value="CANCELLED">ملغي</option></select>`;return `<input data-k="${k}" type="${t}" value="${esc(v)}" placeholder="${l}">`}).join('');$('editor').innerHTML=`<h2>${x.id?'تعديل':'إضافة'} ${d.title}</h2><div class="form">${fields}</div><div class="actions" style="margin-top:12px"><button id="save" class="btn primary">حفظ</button>${x.id?'<button id="cancel" class="btn secondary">إلغاء</button>':''}<span id="msg"></span></div>`;if(d.booking&&x.status){document.querySelector('[data-k="status"]').value=x.status}$('save').onclick=()=>save(x.id);if(x.id)$('cancel').onclick=()=>renderForm()}
async function load(){const d=defs[tab];$('list').innerHTML='<div class="state">جارٍ التحميل...</div>';let q=supabaseClient.from(tab).select('*');if(d.order)q=q.order(d.order,{ascending:tab==='bookings'?false:true});const {data,error}=await q.limit(300);if(error){$('list').innerHTML='<div class="state error">تعذر تحميل البيانات: '+esc(error.message)+'</div>';return}rows=data||[];draw()}
function draw(){const d=defs[tab],term=($('search').value||'').toLowerCase();const data=rows.filter(x=>JSON.stringify(x).toLowerCase().includes(term));$('list').innerHTML=data.map(x=>{const name=x[d.name]||x.patient_name||x.question_ar||'سجل';const detail=tab==='bookings'?`${x.phone||''} • ${x.preferred_date||''} ${x.preferred_time||''}`:(x.category||x.slug||x.excerpt_ar||'');return `<div class="row"><div><strong>${esc(name)}</strong>${x.status?` <span class="badge">${esc(x.status)}</span>`:''}<small>${esc(detail)}</small></div><div class="actions"><button class="btn secondary" onclick="editRow('${x.id}')">تعديل</button>${tab!=='bookings'?`<button class="btn danger" onclick="deleteRow('${x.id}')">حذف</button>`:''}</div></div>`}).join('')||'<div class="state">لا توجد نتائج.</div>'}
function collect(){const o={};document.querySelectorAll('#editor [data-k]').forEach(el=>{let v=el.type==='checkbox'?el.checked:el.value.trim();if(el.type==='number')v=v===''?0:Number(v);if(el.type==='datetime-local'&&v==='')v=null;if(el.dataset.type==='jsonlines')v=v? v.split(/\n+/).map(x=>x.trim()).filter(Boolean):[];o[el.dataset.k]=v});return o}
async function save(id){const o=collect(),msg=$('msg');msg.textContent='جارٍ الحفظ...';const r=id?await supabaseClient.from(tab).update(o).eq('id',id):await supabaseClient.from(tab).insert(o);if(r.error){msg.className='error';msg.textContent='تعذر الحفظ: '+r.error.message;return}msg.className='success';msg.textContent='تم الحفظ.';await load();if(id){const fresh=rows.find(r=>String(r.id)===String(id));renderForm(fresh||{})}else renderForm()}
window.editRow=id=>{const x=rows.find(r=>String(r.id)===String(id));if(x){renderForm(x);$('editor').scrollIntoView({behavior:'smooth',block:'start'});setTimeout(()=>{const f=$('editor').querySelector('input,textarea,select');if(f)f.focus()},350)}};window.deleteRow=async id=>{if(!confirm('هل تريد حذف هذا العنصر؟'))return;const {error}=await supabaseClient.from(tab).delete().eq('id',id);if(error)alert('تعذر الحذف: '+error.message);else load()};$('search').oninput=draw;$('tabs').onclick=e=>{if(!e.target.dataset.tab)return;tab=e.target.dataset.tab;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('search').value='';renderForm();load()};init();
</script></body></html>
