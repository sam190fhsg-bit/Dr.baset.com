<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>إدارة بيانات العيادة</title><link rel="stylesheet" href="site-theme.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f8fa;font-family:Tahoma,Arial;color:#17394d}.wrap{max-width:1200px;margin:auto;padding:18px}.top,.tabs,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.card{background:#fff;border:1px solid #dfe9ed;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 8px 24px rgba(0,50,75,.04)}.tabs{overflow:auto;flex-wrap:nowrap}.tabs button,.btn{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font:inherit;white-space:nowrap}.tabs button.active,.primary{background:#4c963d;color:#fff}.secondary{background:#e9f2f6;color:#064b7c}.danger{background:#fff0f0;color:#a32727}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.form input,.form textarea,.form select{width:100%;padding:11px;border:1px solid #d6e2e7;border-radius:9px;font:inherit;background:#fff}.form textarea{min-height:100px}.full{grid-column:1/-1}.list{display:grid;gap:10px}.row{border:1px solid #e1eaed;border-radius:12px;padding:12px;display:flex;justify-content:space-between;gap:12px;align-items:center}.row small{display:block;color:#667;margin-top:4px}.row-main{display:flex;gap:12px;align-items:center}.thumb{width:72px;height:54px;object-fit:cover;border-radius:9px;background:#eef3f5}.state{padding:18px;text-align:center;color:#667}.success{color:#39792f}.error{color:#a32727}.search{width:100%;padding:12px;border:1px solid #d6e2e7;border-radius:10px}.badge{background:#eef7eb;color:#39792f;padding:4px 8px;border-radius:20px;font-size:12px}.image-field{grid-column:1/-1;display:grid;grid-template-columns:1fr auto;gap:8px}.image-field input{min-width:0}.image-preview{grid-column:1/-1;display:flex;gap:12px;align-items:center;background:#f7fafb;border:1px dashed #cbdde4;border-radius:12px;padding:10px}.image-preview img{width:150px;max-width:42vw;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#eef3f5}.modal{position:fixed;inset:0;background:rgba(9,34,47,.58);display:none;z-index:9999;padding:18px;overflow:auto}.modal.open{display:block}.modal-card{max-width:1000px;margin:3vh auto;background:#fff;border-radius:18px;padding:18px;box-shadow:0 24px 80px rgba(0,0,0,.25)}.modal-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.media-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.media-choice{border:1px solid #dfe9ed;background:#fff;border-radius:12px;padding:0;overflow:hidden;cursor:pointer;text-align:right}.media-choice img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#eef3f5}.media-choice span{display:block;padding:8px;font-size:13px}.bulk-box{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0;padding:12px;background:#f7fbf5;border:1px solid #dbead7;border-radius:12px}@media(max-width:650px){.form{grid-template-columns:1fr}.full{grid-column:auto}.row{align-items:flex-start;flex-direction:column}.image-field{grid-template-columns:1fr}.media-grid{grid-template-columns:repeat(2,1fr)}}
</style><link rel="stylesheet" href="phase24.css?v=24"><link rel="stylesheet" href="phase31.css?v=31"><link rel="stylesheet" href="phase32.css?v=32"></head><body><main class="wrap"><div class="top"><div><h1>إدارة بيانات العيادة</h1><p>الحالات المرضية والخدمات والمقالات والأسئلة والحجوزات.</p></div><a class="btn secondary" href="admin.html">العودة للوحة الإدارة</a></div><div id="gate" class="card">جارٍ التحقق من الصلاحية...</div><section id="app" hidden><div class="tabs" id="tabs"><button data-tab="diseases" class="active">الحالات المرضية</button><button data-tab="services">الخدمات</button><button data-tab="articles">المقالات</button><button data-tab="faqs">الأسئلة الشائعة</button><button data-tab="bookings">الحجوزات</button></div><div id="editor" class="card"></div><div class="card"><div id="contentFilters" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"></div><input id="search" class="search" placeholder="بحث في المحتوى..."><h2>السجلات الحالية</h2><div id="list" class="list"></div></div><div id="mediaModal" class="modal" role="dialog" aria-modal="true" aria-label="اختيار صورة من مكتبة الوسائط"><div class="modal-card"><div class="modal-head"><div><h2 style="margin:0">اختيار من مكتبة الوسائط</h2><small>اضغط على الصورة لربطها بالحالة.</small></div><button id="closeMedia" class="btn secondary" type="button">إغلاق</button></div><input id="mediaSearch" class="search" style="margin-top:12px" placeholder="بحث في الصور..."><div id="mediaGrid" class="media-grid"></div></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let tab='diseases',rows=[];
const defs={
diseases:{title:'حالة مرضية',order:'sort_order',name:'title_ar',fields:[['slug','الرابط المختصر slug','text'],['category','التصنيف','text'],['title_ar','اسم الحالة','text'],['intro_ar','نبذة','textarea'],['diagnosis_ar','التشخيص','textarea'],['treatment_ar','خيارات العلاج العامة','textarea'],['image_url','رابط الصورة','url'],['seo_title','عنوان SEO','text'],['seo_description','وصف SEO','textarea'],['sort_order','الترتيب','number'],['is_published','منشور','check']]},
services:{title:'خدمة',order:'sort_order',name:'title_ar',fields:[['slug','الرابط المختصر slug','text'],['title_ar','اسم الخدمة','text'],['short_description_ar','الوصف المختصر','textarea'],['body_ar','المحتوى','textarea'],['image_url','رابط الصورة','url'],['sort_order','الترتيب','number'],['is_published','منشور','check']]},
articles:{title:'مقال',order:'published_at',name:'title_ar',fields:[['slug','الرابط المختصر slug','text'],['title_ar','عنوان المقال','text'],['excerpt_ar','المقدمة المختصرة','textarea'],['body_ar','المحتوى','textarea'],['cover_url','صورة الغلاف','url'],['category','التصنيف','text'],['published_at','تاريخ النشر','datetime-local'],['is_published','منشور','check']]},
faqs:{title:'سؤال',order:'sort_order',name:'question_ar',fields:[['category','التصنيف','text'],['question_ar','السؤال','text'],['answer_ar','الإجابة','textarea'],['sort_order','الترتيب','number'],['is_published','منشور','check']]},
bookings:{title:'حجز',order:'created_at',name:'full_name',booking:true,fields:[['status','حالة الحجز','status'],['notes','ملاحظات','textarea']]}}
async function init(){const wanted=location.hash.replace('#','');if(defs[wanted]){tab=wanted;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));}const {data:{session}}=await supabaseClient.auth.getSession();if(!session){$('gate').innerHTML='يجب <a href="admin.html">تسجيل الدخول</a> أولًا.';return}const {data:ok,error}=await supabaseClient.rpc('is_content_editor');if(error||ok!==true){$('gate').textContent='لا توجد صلاحية لإدارة المحتوى.';return}$('gate').hidden=true;$('app').hidden=false;renderForm();load()}
function renderForm(x={}){const d=defs[tab];if(d.booking&& !x.id){$('editor').innerHTML='<h2>الحجوزات</h2><p>اختر «تعديل» لتحديث حالة الحجز أو الملاحظات. بيانات المرضى لا تُعرض في الموقع العام.</p>';return}const fields=d.fields.map(([k,l,t])=>{let v=x[k]??'';if(k==='image_url'||k==='cover_url'){return `<div class="image-field"><input data-k="${k}" type="url" value="${esc(v)}" placeholder="${l}"><button class="btn secondary" type="button" data-media-for="${k}">🖼️ اختيار من مكتبة الوسائط</button>${v?`<div class="image-preview"><img src="${esc(v)}" alt="معاينة"><small>الصورة الحالية</small></div>`:''}</div>`}if(t==='textarea')return `<textarea class="full" data-k="${k}" placeholder="${l}">${esc(v)}</textarea>`;if(t==='check')return `<label><input data-k="${k}" type="checkbox" ${v===true||(!x.id&&k==='is_published')?'checked':''}> ${l}</label>`;if(t==='status')return `<select data-k="${k}"><option value="NEW">جديد</option><option value="CONTACTED">تم التواصل</option><option value="CONFIRMED">مؤكد</option><option value="COMPLETED">مكتمل</option><option value="CANCELLED">ملغي</option></select>`;return `<input data-k="${k}" type="${t}" value="${esc(v)}" placeholder="${l}">`}).join('');const bulk=tab==='diseases'?`<div class="bulk-box"><strong>صور الحالات:</strong><button id="autoLink" type="button" class="btn secondary">🔗 ربط الصور تلقائيًا حسب slug</button><span id="autoMsg"></span></div>`:'';$('editor').innerHTML=`<h2>${x.id?'تعديل':'إضافة'} ${d.title}</h2>${bulk}<div class="form">${fields}</div><div class="actions" style="margin-top:12px"><button id="save" class="btn primary">حفظ</button>${x.id?'<button id="cancel" class="btn secondary">إلغاء</button>':''}<span id="msg"></span></div>`;if(d.booking&&x.status){document.querySelector('[data-k="status"]').value=x.status}$('save').onclick=()=>save(x.id);if(x.id)$('cancel').onclick=()=>renderForm();document.querySelectorAll('[data-media-for]').forEach(b=>b.onclick=()=>openMediaPicker(b.dataset.mediaFor));if($('autoLink'))$('autoLink').onclick=autoLinkDiseaseImages}
async function load(){const d=defs[tab];$('list').innerHTML='<div class="state">جارٍ التحميل...</div>';let q=supabaseClient.from(tab).select('*');if(d.order)q=q.order(d.order,{ascending:tab==='bookings'?false:true});const {data,error}=await q.limit(300);if(error){$('list').innerHTML='<div class="state error">تعذر تحميل البيانات: '+esc(error.message)+'</div>';return}rows=data||[];renderContentFilters();draw()}
function draw(){const d=defs[tab],term=($('search').value||'').toLowerCase();const activeCat=window.__activeCat||'all';const data=rows.filter(x=>JSON.stringify(x).toLowerCase().includes(term)).filter(x=>tab!=='diseases'||activeCat==='all'||x.category===activeCat);$('list').innerHTML=data.map(x=>{const name=x[d.name]||x.patient_name||x.question_ar||'سجل';const detail=tab==='bookings'?`${x.phone||''} • ${x.preferred_date||''} ${x.preferred_time||''}`:(x.category||x.slug||x.excerpt_ar||'');return `<div class="row"><div class="row-main">${(x.image_url||x.cover_url)?`<img class="thumb" src="${esc(x.image_url||x.cover_url)}" alt="">`:''}<div><strong>${esc(name)}</strong>${x.status?` <span class="badge">${esc(x.status)}</span>`:''}<small>${esc(detail)}</small></div></div><div class="actions">${['diseases','articles','services','faqs'].includes(tab)?`<button class="btn ${x.is_published?'primary':'secondary'}" onclick="togglePublish('${x.id}',${x.is_published===true})">${x.is_published?'ظاهر ✓':'مخفي'}</button>`:''}<button class="btn secondary" onclick="editRow('${x.id}')">تعديل</button>${tab!=='bookings'?`<button class="btn danger" onclick="deleteRow('${x.id}')">حذف</button>`:''}</div></div>`}).join('')||'<div class="state">لا توجد نتائج.</div>'}
function collect(){const o={};document.querySelectorAll('#editor [data-k]').forEach(el=>{let v=el.type==='checkbox'?el.checked:el.value.trim();if(el.type==='number')v=v===''?0:Number(v);if(el.type==='datetime-local'&&v==='')v=null;o[el.dataset.k]=v});return o}
async function save(id){const o=collect(),msg=$('msg');msg.className='';msg.textContent='جارٍ الحفظ...';try{let q=id?supabaseClient.from(tab).update(o).eq('id',id):supabaseClient.from(tab).insert(o);const {data,error}=await q.select('id');if(error)throw error;if(id&&!data?.length)throw new Error('لم يتم تعديل السجل. تحقق من صلاحيات التعديل RLS.');msg.className='success';msg.textContent='تم الحفظ بنجاح.';await load();renderForm()}catch(e){msg.className='error';msg.textContent='تعذر الحفظ: '+(e.message||e)}}
window.editRow=id=>{const x=rows.find(r=>String(r.id)===String(id));if(x){renderForm(x);$('editor').scrollIntoView({behavior:'smooth',block:'start'})}};window.deleteRow=async id=>{if(!confirm('هل تريد حذف هذا العنصر؟'))return;try{const {data,error}=await supabaseClient.from(tab).delete().eq('id',id).select('id');if(error)throw error;if(!data?.length)throw new Error('لم يتم حذف السجل. تحقق من صلاحيات الحذف RLS.');await load()}catch(e){alert('تعذر الحذف: '+(e.message||e))}};let mediaRows=[],mediaTarget='';
function normKey(v=''){return String(v).toLowerCase().replace(/\.[a-z0-9]+$/i,'').replace(/[^a-z0-9\u0600-\u06ff]+/g,'-').replace(/^-+|-+$/g,'')}
async function openMediaPicker(field){mediaTarget=field;$('mediaModal').classList.add('open');$('mediaGrid').innerHTML='<div class="state">جارٍ تحميل الصور...</div>';const {data,error}=await supabaseClient.from('media').select('id,url,title,alt_text,category,linked_type,linked_id').is('deleted_at',null).order('created_at',{ascending:false}).limit(500);if(error){$('mediaGrid').innerHTML='<div class="state error">تعذر تحميل مكتبة الوسائط.</div>';return}mediaRows=data||[];drawMedia()}
function drawMedia(){const q=($('mediaSearch').value||'').toLowerCase();const list=mediaRows.filter(m=>!q||`${m.title||''} ${m.alt_text||''} ${m.category||''}`.toLowerCase().includes(q));$('mediaGrid').innerHTML=list.map(m=>`<button type="button" class="media-choice" onclick="chooseMedia('${m.id}')"><img loading="lazy" src="${esc(m.url)}" alt="${esc(m.alt_text||'')}"><span>${esc(m.title||m.alt_text||'صورة')}</span></button>`).join('')||'<div class="state">لا توجد صور مطابقة.</div>'}
window.togglePublish=async(id,current)=>{const {error}=await supabaseClient.from(tab).update({is_published:!current}).eq('id',id);if(error){alert('تعذر تغيير الظهور: '+error.message);return}await load()};
function renderContentFilters(){const box=$('contentFilters');if(!box)return;if(tab!=='diseases'){box.innerHTML=tab==='articles'?'<strong>المكتبة الطبية:</strong> إظهار/إخفاء كل مقال من الزر الموجود أمامه.':'';return}const cats=[['all','جميع الحالات'],['internal-medicine','الباطنة'],['liver','الكبد'],['gastroenterology','الجهاز الهضمي'],['endoscopy','المناظير']];box.innerHTML=cats.map(([v,l])=>`<button type="button" class="btn ${((window.__activeCat||'all')===v)?'primary':'secondary'}" onclick="setDiseaseCat('${v}')">${l}</button>`).join('')}
window.setDiseaseCat=v=>{window.__activeCat=v;renderContentFilters();draw()};
window.chooseMedia=async id=>{const m=mediaRows.find(x=>String(x.id)===String(id));if(!m)return;const input=document.querySelector(`#editor [data-k="${mediaTarget}"]`);if(input)input.value=m.url||'';$('mediaModal').classList.remove('open');if(tab==='diseases'){const slug=document.querySelector('#editor [data-k="slug"]')?.value||'';const disease=rows.find(x=>x.slug===slug);if(disease){await supabaseClient.from('media').update({linked_type:'disease',linked_id:disease.id}).eq('id',m.id)}}};
$('closeMedia').onclick=()=> $('mediaModal').classList.remove('open');$('mediaModal').onclick=e=>{if(e.target===$('mediaModal'))$('mediaModal').classList.remove('open')};$('mediaSearch').oninput=drawMedia;
async function autoLinkDiseaseImages(){const btn=$('autoLink'),msg=$('autoMsg');btn.disabled=true;msg.textContent='جارٍ المطابقة...';try{const [{data:ds,error:de},{data:ms,error:me}]=await Promise.all([supabaseClient.from('diseases').select('id,slug,title_ar,image_url').limit(500),supabaseClient.from('media').select('id,url,title,alt_text,storage_path,category').is('deleted_at',null).limit(1000)]);if(de||me)throw(de||me);let linked=0,ambiguous=0;for(const d of ds||[]){const dk=normKey(d.slug),title=normKey(d.title_ar);const matches=(ms||[]).filter(m=>{const vals=[m.title,m.alt_text,(m.storage_path||'').split('/').pop()].map(normKey);return vals.some(v=>v===dk||v===title)});if(matches.length===1){const m=matches[0];const {error:e1}=await supabaseClient.from('diseases').update({image_url:m.url}).eq('id',d.id);if(e1)continue;await supabaseClient.from('media').update({linked_type:'disease',linked_id:d.id}).eq('id',m.id);linked++}else if(matches.length>1)ambiguous++}msg.className='success';msg.textContent=`تم ربط ${linked} صورة تلقائيًا${ambiguous?`، وترك ${ambiguous} حالة متشابهة للمراجعة اليدوية`:''}.`;await load()}catch(e){msg.className='error';msg.textContent='تعذر الربط التلقائي: '+(e.message||e)}finally{btn.disabled=false}}
$('search').oninput=draw;$('tabs').onclick=e=>{if(!e.target.dataset.tab)return;tab=e.target.dataset.tab;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('search').value='';renderForm();load()};init();
</script><script src="phase24.js?v=24" defer></script><script src="phase31.js?v=31" defer></script><script defer src="phase32.js?v=32"></script></body></html>
