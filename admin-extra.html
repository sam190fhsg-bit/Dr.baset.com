<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة إضافات الموقع</title><style>body{font:16px Tahoma,Arial;background:#f5f8f7;color:#173e32;margin:0}.wrap{max-width:1000px;margin:auto;padding:24px}.card{background:white;padding:22px;border:1px solid #dbe7df;border-radius:15px;margin:15px 0}input,textarea,select,button{font:inherit;padding:11px;border-radius:8px;border:1px solid #ccd8d0;box-sizing:border-box}input,textarea{width:100%;margin:6px 0 15px}textarea{min-height:95px}button{background:#477537;color:white;cursor:pointer}.tabs button{margin:4px}.hint{color:#65736a}</style><div class="wrap"><h1>PHASE15 – إدارة إضافات الموقع</h1><a href="admin.html">العودة للوحة التحكم</a><div id="status" class="card">التحقق من الصلاحيات...</div><div id="app" hidden><div class="tabs" id="tabs"></div><div id="form" class="card"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="document.write('<script src=&quot;https://unpkg.com/@supabase/supabase-js@2&quot;><\/script>')"></script><script src="supabase-config.js"></script><script>const sections={doctor:['صفحة الدكتور',[['heading','عنوان الصفحة'],['description','السيرة والتخصصات']]],identity:['الرسالة والرؤية والأهداف',[['heading','العنوان'],['mission','الرسالة'],['vision','الرؤية'],['goals','الأهداف']]],patient_journey:['رحلة المراجع',[['heading','العنوان'],['steps','خطوات رحلة المراجع']]],careers:['صفحة التوظيف',[['heading','العنوان'],['description','مقدمة وتعليمات التوظيف']]],slider_settings:['حركة السلايدر',[['interval','مدة العرض بالمللي ثانية'],['transition','مدة الانتقال بالمللي ثانية']]]};let active='doctor';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function originalContent(key){
 const source={doctor:'about.html',identity:'identity.html',careers:'careers.html',patient_journey:'index.html'}[key];if(!source)return {};
 try{const response=await fetch(source,{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const doc=new DOMParser().parseFromString(await response.text(),'text/html');const t=(sel)=>doc.querySelector(sel)?.textContent?.trim()||'';
 if(key==='identity'){const result={heading:t('.pagehero h1')};for(const [label,field] of [['الرسالة','mission'],['الرؤية','vision'],['الأهداف','goals']]){const card=[...doc.querySelectorAll('.extras-card')].find(el=>el.querySelector('h3')?.textContent.trim()===label);result[field]=card?.querySelector('p')?.textContent.trim()||''}return result}
 if(key==='doctor')return {heading:t('h1'),description:t('main')||t('.about-content')};
 if(key==='careers')return {heading:t('.pagehero h1'),description:t('.extras-card p')};
 if(key==='patient_journey'){const section=[...doc.querySelectorAll('section')].find(el=>/رحلة (المريض|المراجع)/.test(el.querySelector('h2,h3')?.textContent||''));return section?{heading:section.querySelector('h2,h3')?.textContent.trim(),steps:section.textContent.trim()}:{} }
 }catch(e){$('status').textContent='تعذر قراءة المحتوى الأصلي: '+e.message}return {}
}
async function show(){const {data,error}=await supabaseClient.from('site_sections').select('content').eq('section_key',active).maybeSingle();if(error){$('status').textContent='تعذر قراءة إعدادات الصفحة: '+error.message;return}const content=data?.content||await originalContent(active);$('form').innerHTML='<h2>'+sections[active][0]+'</h2>'+sections[active][1].map(([k,label])=>'<label>'+label+'</label><textarea data-key="'+k+'">'+esc(content[k]||'')+'</textarea>').join('')+'<button id="save">حفظ التغييرات</button>';$('save').onclick=async()=>{const c={...(await supabaseClient.from('site_sections').select('content').eq('section_key',active).maybeSingle()).data?.content||{}};$('form').querySelectorAll('[data-key]').forEach(x=>c[x.dataset.key]=x.value);if(active==='slider_settings'){for(const k of ['interval','transition']){c[k]=Number(c[k]);if(!Number.isFinite(c[k])||c[k]<0){$('status').textContent='قيم حركة السلايدر غير صالحة';return}}}const {error}=await supabaseClient.from('site_sections').upsert({section_key:active,content:c},{onConflict:'section_key'});$('status').textContent=error?'فشل الحفظ: '+error.message:'تم حفظ التعديلات بنجاح.'}}async function init(){const {data:{session}}=await supabaseClient.auth.getSession();if(!session){$('status').textContent='سجّل الدخول من لوحة الإدارة أولًا.';return}const {data,error}=await supabaseClient.rpc('is_content_editor');if(error||data!==true){$('status').textContent='الحساب لا يملك صلاحية التحرير.';return}$('app').hidden=false;$('status').textContent='تظهر القيم الأصلية عند عدم وجود تعديلات محفوظة. راجع المحتوى قبل الحفظ؛ لا تضغط حفظ إذا كانت الحقول فارغة.';for(const [key,[title]] of Object.entries(sections)){const b=document.createElement('button');b.textContent=title;b.onclick=()=>{active=key;show()};$('tabs').append(b)}show()}init()</script></html>
