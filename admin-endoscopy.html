<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>إدارة مناظير الجهاز الهضمي</title><link rel="stylesheet" href="site-theme.css"><style>body{font-family:Tahoma,Arial;background:#f4f8fa;color:#17394d}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dfe9ed;border-radius:16px;padding:18px;margin:14px 0}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form input,.form textarea{padding:11px;border:1px solid #d6e2e7;border-radius:9px;font:inherit}.form textarea{min-height:110px}.full{grid-column:1/-1}.btn{border:0;border-radius:9px;padding:10px 14px;cursor:pointer}.primary{background:#4c963d;color:#fff}.secondary{background:#e9f2f6;color:#064b7c}.danger{background:#fff0f0;color:#a32727}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid #e1eaed;border-radius:12px;padding:12px;margin:8px 0}.actions{display:flex;gap:7px;flex-wrap:wrap}.thumb{width:80px;height:60px;object-fit:cover;border-radius:8px}@media(max-width:650px){.form{grid-template-columns:1fr}.full{grid-column:auto}.row{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><a href="admin.html">العودة للوحة الإدارة</a><h1>إدارة مناظير الجهاز الهضمي</h1><div id="gate" class="card">جارٍ التحقق...</div><section id="app" hidden><div class="card"><h2 id="formTitle">إضافة خدمة منظار</h2><div class="form"><input id="slug" placeholder="الرابط المختصر slug"><input id="title_ar" placeholder="اسم المنظار أو الخدمة"><textarea id="short_description_ar" placeholder="الوصف المختصر"></textarea><textarea id="body_ar" placeholder="المحتوى الكامل: التعريف، الاستخدامات، التحضير، قبل/أثناء/بعد الإجراء، والتنبيهات"></textarea><input id="image_url" class="full" placeholder="رابط الصورة"><input id="sort_order" type="number" placeholder="الترتيب"><label><input id="is_published" type="checkbox" checked> ظاهر في الموقع</label></div><div class="actions" style="margin-top:12px"><button id="save" class="btn primary">حفظ</button><button id="cancel" class="btn secondary">إلغاء التعديل</button><span id="msg"></span></div></div><div class="card"><h2>خدمات المناظير الحالية</h2><div id="list"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="document.write('<script src=&quot;https://unpkg.com/@supabase/supabase-js@2&quot;><\/script>')"></script><script src="supabase-config.js"></script><script>
let rows=[],editing=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function init(){const {data:{session}}=await supabaseClient.auth.getSession();if(!session){$('gate').innerHTML='يجب <a href="admin.html">تسجيل الدخول</a> أولًا.';return}const {data:ok}=await supabaseClient.rpc('is_content_editor');if(ok!==true){$('gate').textContent='لا توجد صلاحية.';return}$('gate').hidden=true;$('app').hidden=false;load()}
function obj(){return {slug:$('slug').value.trim(),title_ar:$('title_ar').value.trim(),short_description_ar:$('short_description_ar').value.trim(),body_ar:$('body_ar').value.trim(),image_url:$('image_url').value.trim(),sort_order:Number($('sort_order').value||0),is_published:$('is_published').checked,category:'endoscopy'}}
function reset(){editing=null;['slug','title_ar','short_description_ar','body_ar','image_url','sort_order'].forEach(k=>$(k).value='');$('is_published').checked=true;$('formTitle').textContent='إضافة خدمة منظار'}
async function load(){let r=await supabaseClient.from('services').select('*').eq('category','endoscopy').order('sort_order');if(r.error){$('list').innerHTML='<p>تعذر التحميل: '+esc(r.error.message)+'</p>';return}rows=r.data||[];$('list').innerHTML=rows.map(x=>`<div class="row"><div>${x.image_url?`<img class="thumb" src="${esc(x.image_url)}">`:''}<strong>${esc(x.title_ar)}</strong><div>${x.is_published?'ظاهر':'مخفي'}</div></div><div class="actions"><button class="btn ${x.is_published?'primary':'secondary'}" onclick="toggle('${x.id}',${!!x.is_published})">${x.is_published?'إخفاء':'إظهار'}</button><button class="btn secondary" onclick="edit('${x.id}')">تعديل</button><button class="btn danger" onclick="del('${x.id}')">حذف</button></div></div>`).join('')||'<p>لا توجد خدمات مناظير بعد.</p>'}
$('save').onclick=async()=>{const data=obj();$('msg').textContent='جارٍ الحفظ...';let r=editing?await supabaseClient.from('services').update(data).eq('id',editing).select('id'):await supabaseClient.from('services').insert(data).select('id');if(r.error){$('msg').textContent='تعذر الحفظ: '+r.error.message;return}$('msg').textContent='تم الحفظ بنجاح';reset();load()};$('cancel').onclick=reset;
window.edit=id=>{const x=rows.find(r=>String(r.id)===String(id));if(!x)return;editing=id;['slug','title_ar','short_description_ar','body_ar','image_url','sort_order'].forEach(k=>$(k).value=x[k]??'');$('is_published').checked=!!x.is_published;$('formTitle').textContent='تعديل خدمة المنظار';scrollTo({top:0,behavior:'smooth'})};
window.toggle=async(id,current)=>{const r=await supabaseClient.from('services').update({is_published:!current}).eq('id',id).select('id');if(r.error)alert('تعذر تغيير الظهور: '+r.error.message);else load()};window.del=async id=>{if(!confirm('حذف هذه الخدمة نهائيًا؟'))return;const r=await supabaseClient.from('services').delete().eq('id',id).select('id');if(r.error)alert('تعذر الحذف: '+r.error.message);else load()};init();
</script></body></html>
