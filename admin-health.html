<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>فحص صحة لوحة الإدارة</title><link rel="stylesheet" href="site-theme.css"><style>body{font-family:Tahoma,Arial;background:#f6f9f5;color:#243b2b;margin:0}.wrap{max-width:1050px;margin:24px auto;padding:16px}h1{color:#477537}.panel{background:white;border:1px solid #dce8d6;border-radius:14px;padding:18px;margin:14px 0}.btn{background:#477537;color:white;padding:12px 18px;border:0;border-radius:9px;cursor:pointer;text-decoration:none;display:inline-block}.muted{color:#53665a}.ok{color:#256c3c}.warn{color:#9a5c00}.bad{color:#b12c2c}table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:right;border-bottom:1px solid #e5ece3}button:disabled{opacity:.5}</style></head><body><main class="wrap"><a href="admin.html">← العودة للوحة الإدارة</a><h1>فحص صحة المحتوى والصلاحيات</h1><p>فحص للقراءة فقط؛ لا يغيّر ولا يحذف أي سجل.</p><section class="panel" id="gate">جارٍ التحقق من تسجيل الدخول والصلاحيات...</section><section class="panel" id="tools" hidden><button class="btn" id="run">تشغيل الفحص</button> <button class="btn" id="export" disabled>تصدير التقرير JSON</button><div id="status" aria-live="polite"></div><div id="results"></div></section></main><script>
/* PHASE43: robust library loading without changing Supabase configuration. */
async function loadScript(src){return new Promise((resolve,reject)=>{const el=document.createElement('script');el.src=src;el.onload=resolve;el.onerror=()=>reject(new Error('تعذر تحميل '+src));document.head.appendChild(el)})}
async function prepareSupabase(){
 const sources=['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js','https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js','https://cdnjs.cloudflare.com/ajax/libs/supabase-js/2.49.4/umd/supabase.min.js'];
 if(!window.supabase?.createClient){for(const url of sources){try{await loadScript(url);if(window.supabase?.createClient)break}catch(e){console.warn('Supabase CDN unavailable',e)}}}
 if(!window.supabase?.createClient)throw new Error('تعذر تحميل مكتبة Supabase. تحقق من اتصال الإنترنت أو مانع المحتوى ثم أعد المحاولة.');
 await loadScript('supabase-config.js');
 if(typeof supabaseClient==='undefined'||!supabaseClient?.auth)throw new Error('تعذر تهيئة إعدادات Supabase. تحقق من ملف supabase-config.js.');
}
async function startHealth(){try{await prepareSupabase();await init()}catch(e){document.getElementById('gate').textContent='تعذر بدء الفحص: '+(e.message||e)}}
</script><script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let report=null;
async function init(){try{if(!window.supabaseClient)throw Error('تعذر الاتصال بمكتبة Supabase');const {data:{session},error}=await supabaseClient.auth.getSession();if(error)throw error;if(!session){$('gate').textContent='سجّل الدخول من لوحة الإدارة أولًا.';return}const p=await supabaseClient.rpc('is_content_editor');if(p.error||p.data!==true){$('gate').textContent='هذا الفحص متاح للمحرر المخوّل فقط.';return}$('gate').hidden=true;$('tools').hidden=false}catch(e){$('gate').textContent='تعذر بدء الفحص: '+e.message}}
const specs=[['diseases','الحالات المرضية'],['services','الخدمات والمناظير'],['articles','المكتبة الطبية'],['events','الفعاليات'],['faqs','الأسئلة الشائعة'],['media','مكتبة الوسائط'],['sliders','السلايدر'],['videos','الفيديوهات'],['page_visibility','إظهار الصفحات'],['working_hours','أوقات الدوام']];
async function audit(){ $('run').disabled=true;$('status').textContent='جارٍ فحص الجداول...';const results=[];for(const [table,label] of specs){try{const {count,error}=await supabaseClient.from(table).select('*',{count:'exact',head:true});results.push({table,label,count,error:error?error.message:null})}catch(e){results.push({table,label,count:null,error:e.message})}}report={generated_at:new Date().toISOString(),results};$('results').innerHTML='<table><thead><tr><th>القسم</th><th>عدد السجلات</th><th>حالة القراءة</th></tr></thead><tbody>'+results.map(x=>'<tr><td>'+esc(x.label)+'</td><td>'+(x.count??'—')+'</td><td class="'+(x.error?'bad':'ok')+'">'+esc(x.error||'متاح')+'</td></tr>').join('')+'</tbody></table><p class="muted">هذا فحص وصول للقراءة فقط. لا يؤكد صلاحية الحفظ أو الحذف، ولا يكشف بيانات المرضى.</p>';$('status').textContent='اكتمل الفحص';$('export').disabled=false;$('run').disabled=false}
$('run').onclick=audit;$('export').onclick=()=>{if(!report)return;const blob=new Blob([JSON.stringify(report,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='admin-health-report.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};startHealth();
</script></body></html>
