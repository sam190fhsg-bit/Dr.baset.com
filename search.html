*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,Arial,sans-serif;background:#f7f9f7;color:#202520;line-height:1.8}
a{text-decoration:none}
.container{width:92%;max-width:1100px;margin:auto}
header{background:#fff;border-bottom:1px solid #e8ede6;position:sticky;top:0;z-index:1000}
.nav{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:56px;height:56px;object-fit:contain}
.brand strong{color:#356b35}
.back{background:#477537;color:#fff;padding:9px 16px;border-radius:8px}
.hero{padding:55px 20px;text-align:center;background:linear-gradient(135deg,#fff,#edf5e9)}
.hero h1{color:#356b35;font-size:34px;margin-bottom:8px}
.hero p{color:#687168}
.search-wrap{padding:40px 0 70px}
.search-box{background:#fff;padding:20px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.06);margin-bottom:25px}
.search-box input{width:100%;padding:15px 16px;border:1px solid #dfe7dc;border-radius:12px;font-family:inherit;font-size:17px;outline:none}
.search-box input:focus{border-color:#477537}
.results-count{color:#687168;margin:0 0 15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.result{display:block;background:#fff;border:1px solid #e8ede6;padding:20px;border-radius:16px;color:inherit;transition:.2s}
.result:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.07)}
.result .cat{display:inline-block;background:#edf3e9;color:#477537;padding:4px 9px;border-radius:20px;font-size:12px;margin-bottom:8px}
.result h3{color:#356b35;margin-bottom:6px;font-size:19px}
.result p{color:#687168;font-size:14px}
.empty{background:#fff;padding:30px;text-align:center;border-radius:16px;color:#687168}
footer{background:#284f28;color:#fff;padding:25px;text-align:center}
@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.grid{grid-template-columns:1fr}.hero h1{font-size:27px}.brand strong{font-size:14px}.brand img{width:48px;height:48px}}

const input = document.getElementById("searchInput");
const results = document.getElementById("results");
const count = document.getElementById("resultsCount");

function normalize(s){
  return (s||"")
    .toLowerCase()
    .replace(/[أإآ]/g,"ا")
    .replace(/ة/g,"ه")
    .replace(/ى/g,"ي")
    .replace(/\s+/g," ")
    .trim();
}

function render(list){
  results.innerHTML = "";
  count.textContent = "عدد النتائج: " + list.length;

  if(!list.length){
    results.innerHTML = '<div class="empty">لا توجد نتائج مطابقة. جرّب كلمة أخرى.</div>';
    return;
  }

  list.forEach(x=>{
    const a = document.createElement("a");
    a.className = "result";
    a.href = x.u;
    a.innerHTML = `
      <span class="cat">${x.c}</span>
      <h3>${x.t}</h3>
      <p>${x.d}</p>
    `;
    results.appendChild(a);
  });
}

input.addEventListener("input", ()=>{
  const q = normalize(input.value);
  if(!q){ render(items); return; }

  const filtered = items.filter(x=>{
    const hay = normalize(x.t+" "+x.c+" "+x.d);
    return hay.includes(q);
  });

  render(filtered);
});

render(items);
