<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>أمراض الكبد | عيادة الدكتور عبده الباسط</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Tahoma,Arial,sans-serif;
      background:#f7f9f7;
      color:#202520;
      line-height:1.8;
    }

    a{
      text-decoration:none;
    }

    .container{
      width:92%;
      max-width:1180px;
      margin:auto;
    }

    header{
      background:#fff;
      border-bottom:1px solid #e8ede6;
      position:sticky;
      top:0;
      z-index:1000;
    }

    .nav{
      min-height:80px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .brand img{
      width:58px;
      height:58px;
      object-fit:contain;
    }

    .brand strong{
      color:#356b35;
      font-size:18px;
    }

    .back-btn{
      background:#477537;
      color:white;
      padding:9px 16px;
      border-radius:8px;
    }

    .hero{
      padding:65px 20px;
      text-align:center;
      background:linear-gradient(135deg,#ffffff,#edf5e9);
    }

    .hero h1{
      color:#356b35;
      font-size:38px;
      margin-bottom:10px;
    }

    .hero p{
      color:#667266;
      max-width:750px;
      margin:auto;
    }

    .section{
      padding:60px 0;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:18px;
    }

    .disease{
      background:#fff;
      padding:24px;
      border-radius:18px;
      border:1px solid #e8ede6;
      box-shadow:0 7px 24px rgba(0,0,0,.04);
    }

    .disease h3{
      color:#477537;
      margin-bottom:8px;
      font-size:20px;
    }

    .disease p{
      color:#687168;
      font-size:14px;
    }

    .warning{
      margin-top:35px;
      background:#f3f7f1;
      border-right:4px solid #477537;
      padding:20px;
      border-radius:12px;
      color:#556255;
    }

    .cta{
      background:#477537;
      color:white;
      padding:50px 20px;
      text-align:center;
    }

    .cta h2{
      margin-bottom:10px;
      font-size:30px;
    }

    .cta p{
      margin-bottom:20px;
    }

    .cta a{
      display:inline-block;
      background:white;
      color:#477537;
      padding:12px 22px;
      border-radius:9px;
      font-weight:bold;
    }

    footer{
      background:#284f28;
      color:#fff;
      padding:25px;
      text-align:center;
    }

    @media(max-width:900px){
      .grid{
        grid-template-columns:1fr 1fr;
      }
    }

    @media(max-width:600px){
      .grid{
        grid-template-columns:1fr;
      }
