<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>تشخيص اتصال موقع العيادة</title><style>*{box-sizing:border-box}body{margin:0;background:#f8faf8;color:#263b2a;font:15px/1.9 Tahoma,Arial,sans-serif}.wrap{width:min(94%,850px);margin:24px auto}h1{color:#477537;font-size:25px}a{color:#3c6832}.box{background:white;border:1px solid #e0e8dc;border-radius:13px;margin:15px 0;padding:16px}button{background:#477537;color:white;border:0;border-radius:8px;padding:12px 20px;font:inherit;cursor:pointer}.result{padding:11px;border-bottom:1px solid #ebf0e7}.result:last-child{border-bottom:0}.status{font-weight:bold}.good{color:#277344}.bad{color:#ab4134}.warn{color:#a56a0a}small{color:#6f8174}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f8f4;padding:10px;border-radius:8px;font-size:12px}code{direction:ltr;unicode-bidi:embed}</style></head><body><main class="wrap"><p><a href="index.html">الرئيسية</a> | <a href="admin.html">لوحة الإدارة</a></p><h1>فحص وصول الموقع ومكتبة Supabase</h1><p>هذه الصفحة مستقلة عن تسجيل الدخول ولا تتطلب بيانات أو تغييرات في قاعدة البيانات. الفحص لا يحذف ولا يكتب أي معلومات.</p><div class="box"><button id="run">تشغيل فحص الاتصال</button> <button id="copy" disabled>نسخ النتيجة</button><p id="summary" role="status"></p></div><div class="box" id="results"></div><p><small>الفحص يقيس الوصول من متصفحك فقط، ولا يؤكد صلاحيات قاعدة البيانات أو عمل جميع وظائف لوحة الإدارة.</small></p></main><script>
(function(){'use strict';
const results=document.getElementById('results'),summary=document.getElementById('summary'),run=document.getElementById('run'),copy=document.getElementById('copy');let fullReport='';
function row(label,value,ok){const div=document.createElement('div');div.className='result';const name=document.createElement('strong');name.textContent=label+' — ';const state=document.createElement('span');state.className='status '+(ok===true?'good':ok===false?'bad':'warn');state.textContent=value;div.append(name,state);results.append(div)}
async function fetchFile(file){const c=new AbortController(),t=setTimeout(()=>c.abort(),6500);try{const r=await fetch(file+'?health='+Date.now(),{cache:'no-store',signal:c.signal});return {ok:r.ok,status:r.status,detail:r.ok?'متاح':'HTTP '+r.status}}catch(e){return {ok:false,detail:e.name==='AbortError'?'انتهت المهلة':(e.message||'تعذر الاتصال')}}finally{clearTimeout(t)}}
async function cdn(url){return new Promise(resolve=>{const s=document.createElement('script');let finished=false;const timer=setTimeout(()=>done(false,'انتهت مهلة التحميل'),7500);function done(ok,detail){if(finished)return;finished=true;clearTimeout(timer);s.remove();resolve({ok,detail})}s.async=true;s.src=url;s.onload=()=>done(!!window.supabase?.createClient,'تم تحميل المكتبة');s.onerror=()=>done(false,'تعذّر التحميل');document.head.append(s)})}
async function runAll(){run.disabled=true;copy.disabled=true;results.textContent='';summary.textContent='جارٍ الفحص…';const data=[];async function add(name,callback){try{const r=await callback();data.push({name,...r});row(name,r.detail,r.ok)}catch(e){const r={name,ok:false,detail:e.message||'خطأ غير معروف'};data.push(r);row(name,r.detail,false)}}
await add('الصفحة الرئيسية index.html',()=>fetchFile('index.html'));
await add('لوحة الإدارة admin.html',()=>fetchFile('admin.html'));
await add('صفحة أمراض الباطنة',()=>fetchFile('internal-medicine.html'));
await add('ملف إعداد Supabase',()=>fetchFile('supabase-config.js'));
await add('مكتبة Supabase من jsDelivr',()=>cdn('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'));
if(!window.supabase?.createClient)await add('المصدر الاحتياطي unpkg',()=>cdn('https://unpkg.com/@supabase/supabase-js@2'));
const count=data.filter(x=>x.ok).length;summary.textContent='النتيجة: '+count+' من '+data.length+' اختبارات ناجحة.';fullReport=JSON.stringify({date:new Date().toISOString(),origin:location.origin,service_worker_active:!!navigator.serviceWorker?.controller,results:data},null,2);copy.disabled=false;run.disabled=false;}
run.onclick=runAll;copy.onclick=()=>{if(navigator.clipboard?.writeText)navigator.clipboard.writeText(fullReport).then(()=>{summary.textContent+=' تم نسخ التقرير.'}).catch(()=>fallback());else fallback();function fallback(){const t=document.createElement('textarea');t.value=fullReport;document.body.append(t);t.select();document.execCommand('copy');t.remove();summary.textContent+=' تم نسخ التقرير.'}};
})();
</script></body></html>
