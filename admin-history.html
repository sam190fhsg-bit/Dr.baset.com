<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>سجل مراجعات المحتوى - PHASE54</title><style>body{font:15px/1.9 Tahoma,Arial;background:#f5f8fa;color:#183e54;margin:0}main{max-width:1080px;margin:25px auto;padding:16px}a{color:#145a7c}h1{font-size:24px}.panel{background:white;padding:20px;border:1px solid #dbe8ec;border-radius:15px;margin:16px 0}button,select{font:inherit;padding:10px;border:1px solid #c9dde1;border-radius:9px;background:white;cursor:pointer}button.primary{background:#477537;color:#fff;border:0}button:disabled{opacity:.5}.item{border-bottom:1px solid #e1eaee;padding:12px 0}.muted{color:#607380;font-size:13px}pre{overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f7f8;padding:12px;border-radius:8px;max-height:350px}summary{cursor:pointer;font-weight:bold}#status{padding:14px}button:focus-visible,a:focus-visible{outline:3px solid #477537}</style></head><body><main><a href="admin.html">← العودة للوحة الإدارة</a><h1>سجل تعديل المحتوى واستعادة النسخ</h1><p>يشمل المقالات والأمراض والخدمات والفعاليات والفيديوهات فقط. لا يشمل بيانات المرضى أو الحجوزات.</p><section class="panel"><label for="filter">نوع المحتوى: </label><select id="filter"><option value="">الكل</option><option value="articles">المقالات</option><option value="diseases">الأمراض</option><option value="services">الخدمات</option><option value="events">الفعاليات</option><option value="videos">الفيديوهات</option></select> <button id="reload">تحديث</button><div id="status" role="status">جارٍ التحقق من الصلاحية...</div><div id="list"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const tables=new Set(['articles','diseases','services','events','videos']);let rows=[];
async function load(){if(typeof supabaseClient==='undefined'||!supabaseClient){$('status').textContent='تعذر تحميل Supabase.';return}const {data:{session}}=await supabaseClient.auth.getSession();if(!session){$('status').textContent='يجب تسجيل الدخول أولًا من لوحة الإدارة.';return}const p=await supabaseClient.rpc('is_content_editor');if(p.error||p.data!==true){$('status').textContent='لا توجد صلاحية.';return}let q=supabaseClient.from('editorial_history').select('id,entity_table,entity_id,operation,before_data,after_data,changed_at,changed_by').order('changed_at',{ascending:false}).limit(100);if($('filter').value)q=q.eq('entity_table',$('filter').value);const {data,error}=await q;if(error){$('status').textContent='تعذر عرض السجل. تأكد من تشغيل PHASE54-HISTORY.sql في Supabase: '+error.message;return}rows=data||[];$('status').textContent=`تم تحميل آخر ${rows.length} سجل مراجعة.`;$('list').innerHTML=rows.map(r=>{const name=r.after_data?.title_ar||r.before_data?.title_ar||r.after_data?.slug||r.before_data?.slug||r.entity_id;return `<article class="item"><strong>${safe(name)}</strong> <span class="muted">${safe(r.entity_table)} — ${safe(r.operation)} — ${safe(new Date(r.changed_at).toLocaleString('ar'))}</span><details><summary>عرض تفاصيل التعديل</summary><p class="muted">النسخة السابقة</p><pre>${safe(JSON.stringify(r.before_data,null,2))}</pre><p class="muted">النسخة الجديدة</p><pre>${safe(JSON.stringify(r.after_data,null,2))}</pre>${r.operation==='UPDATE'&&r.before_data?`<button class="primary" data-restore="${r.id}">استعادة النسخة السابقة</button>`:''}</details></article>`}).join('')||'<p>لا توجد مراجعات محفوظة بعد.</p>'}
$('list').addEventListener('click',async e=>{const b=e.target.closest('[data-restore]');if(!b)return;const r=rows.find(x=>String(x.id)===b.dataset.restore);if(!r||!tables.has(r.entity_table)||r.operation!=='UPDATE'||!r.before_data)return;if(!confirm('هل تريد استعادة النسخة السابقة؟ سيتم تسجيل التعديل الجديد في السجل.'))return;const obj={...r.before_data};delete obj.id;delete obj.created_at;delete obj.updated_at;delete obj.deleted_at;b.disabled=true;const {data,error}=await supabaseClient.from(r.entity_table).update(obj).eq('id',r.entity_id).select('id');b.disabled=false;if(error||!data?.length){alert('تعذرت الاستعادة. تحقق من صلاحيات RLS وبنية جدول المحتوى: '+(error?.message||'لم يؤكد الخادم التعديل'));return}alert('تمت استعادة النسخة السابقة.');load()});$('reload').onclick=load;$('filter').onchange=load;load()})();
</script></body></html>
