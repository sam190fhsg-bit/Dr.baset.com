<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة واجهة الموقع</title><style>body{font:15px Tahoma,Arial;background:#f4f8f7;color:#173d3b;margin:0}header{padding:14px;background:#fff;display:flex;gap:12px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #dce5e1}button{background:#477537;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}button:disabled{opacity:.5}main{display:grid;grid-template-columns:minmax(240px,300px) minmax(0,1fr);gap:12px;padding:12px;height:calc(100vh - 94px)}aside{background:#fff;padding:15px;border-radius:12px;overflow:auto}iframe{width:100%;height:100%;border:1px solid #dce5e1;border-radius:12px;background:#fff}label{display:block;margin:15px 0 5px}input,textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #ccd8d0;border-radius:8px}textarea{height:130px}#msg{white-space:pre-wrap;color:#426f38}small{color:#666}@media(max-width:750px){main{display:flex;flex-direction:column;height:auto}aside{min-height:220px}iframe{height:65vh}}</style><header><b>إدارة واجهة الموقع</b><a href="admin.html">العودة للوحة التحكم</a><button id="save" disabled>حفظ ونشر</button><button id="reset" disabled>استعادة الواجهة الأصلية</button><span id="msg">التحقق من الدخول...</span></header><main><aside><p>اضغط على أي نص أو صورة في المعاينة لتعديلها. لا يتم تغيير بقية الملفات أو المحتويات.</p><small id="target">لم يتم اختيار عنصر</small><label>النص / رابط الصورة</label><textarea id="val" disabled></textarea><button id="apply" disabled>تطبيق في المعاينة</button><p><small>الصور: أدخل رابط صورة عام مباشر HTTPS. لا تُعدّل صورة الطبيب الأصلية إلا إذا اخترت صورتها صراحةً.</small></p></aside><iframe id="preview" title="معاينة الصفحة الرئيسية" src="index.html"></iframe></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const $=x=>document.getElementById(x),status=$('msg'),frame=$('preview');let patches=[],selected=null,ready=false;const path=el=>{let arr=[];while(el&&el.nodeType===1&&el!==frame.contentDocument.documentElement){let i=1,s=el;while((s=s.previousElementSibling))if(s.tagName===el.tagName)i++;arr.unshift(el.tagName.toLowerCase()+':nth-of-type('+i+')');el=el.parentElement}return arr.join(' > ')};const install=()=>{let doc=frame.contentDocument;if(!doc)return;doc.addEventListener('click',e=>{if(!ready)return;let el=e.target;if(el.closest('a,button')){e.preventDefault()}else e.preventDefault();if(el.tagName!=='IMG'&&el.children.length) {let leaf=[...el.querySelectorAll('*')].find(x=>!x.children.length&&x.textContent.trim());if(leaf)el=leaf}if(el.tagName!=='IMG'&&el.children.length)return;selected={selector:path(el),type:el.tagName==='IMG'?'image':'text',el};$('target').textContent=selected.type==='image'?'صورة مختارة':'نص مختار';$('val').value=selected.type==='image'?el.getAttribute('src')||'':el.textContent;$('val').disabled=false;$('apply').disabled=false},true)};frame.addEventListener('load',install);$('apply').onclick=()=>{if(!selected)return;let v=$('val').value;if(selected.type==='image'){if(!/^https:\/\//i.test(v)&&!/^\.?\/?[\w./-]+$/.test(v)){status.textContent='رابط الصورة غير صالح';return}selected.el.setAttribute('src',v)}else selected.el.textContent=v;patches=patches.filter(p=>p.selector!==selected.selector);patches.push({selector:selected.selector,type:selected.type,value:v});status.textContent='تعديل غير منشور؛ اضغط حفظ ونشر'};$('save').onclick=async()=>{if(!ready)return;let {error}=await supabaseClient.from('site_sections').upsert({section_key:'homepage_visual_overrides',content:{patches}},{onConflict:'section_key'});status.textContent=error?'فشل الحفظ: '+error.message:'تم الحفظ؛ حدّث الصفحة العامة لرؤية التغييرات'};$('reset').onclick=async()=>{if(!confirm('استعادة الواجهة الأصلية وإلغاء تعديلات محرر الواجهة فقط؟'))return;patches=[];await $('save').onclick();frame.src='index.html'};(async()=>{if(typeof supabaseClient==='undefined'){status.textContent='إعداد Supabase غير متوفر';return}const {data:{session}}=await supabaseClient.auth.getSession();if(!session){location.href='admin.html';return}let r=await supabaseClient.from('site_sections').select('content').eq('section_key','homepage_visual_overrides').maybeSingle();if(r.error){status.textContent='خطأ في قاعدة البيانات: '+r.error.message;return}patches=r.data?.content?.patches||[];ready=true;$('save').disabled=false;$('reset').disabled=false;status.textContent='جاهز للتعديل. يلزم امتلاك صلاحية محرر للحفظ.'})();</script></html>
