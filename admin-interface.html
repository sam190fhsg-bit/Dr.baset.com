<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة جميع صفحات الواجهة – PHASE19</title><style>body{margin:0;background:#f2f7f4;color:#173d3b;font:15px Tahoma,Arial}header{background:white;padding:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}main{display:grid;grid-template-columns:320px 1fr;gap:12px;padding:12px}aside{background:white;padding:16px;border-radius:12px;max-height:83vh;overflow:auto}iframe{width:100%;height:83vh;border:1px solid #ddd;background:white;border-radius:12px}button{background:#477537;color:white;border:0;border-radius:8px;padding:10px;cursor:pointer;margin:3px}button:disabled{opacity:.45}input,select,textarea{width:100%;box-sizing:border-box;padding:9px;margin:6px 0 12px;border:1px solid #ccd8d0;border-radius:6px}textarea{height:90px}#msg{font-size:13px}small{color:#666} @media(max-width:760px){main{display:flex;flex-direction:column}iframe{height:65vh}aside{max-height:none}}</style><header><strong>PHASE19 | إدارة واجهة الموقع</strong><a href="admin.html">العودة للإدارة</a><button id="save" disabled>حفظ ونشر</button><span id="msg">جاري التحقق...</span></header><main><aside><label>اختر الصفحة</label><select id="page"><option value="404.html">404.html</option><option value="about.html">about.html</option><option value="accessibility.html">accessibility.html</option><option value="articles.html">articles.html</option><option value="booking.html">booking.html</option><option value="careers.html">careers.html</option><option value="conditions.html">conditions.html</option><option value="contact.html">contact.html</option><option value="disease-2.html">disease-2.html</option><option value="disease-details.html">disease-details.html</option><option value="disease.html">disease.html</option><option value="endoscopy.html">endoscopy.html</option><option value="events.html">events.html</option><option value="faq.html">faq.html</option><option value="gallery.html">gallery.html</option><option value="gastroenterology.html">gastroenterology.html</option><option value="gerd.html">gerd.html</option><option value="identity.html">identity.html</option><option value="index.html">index.html</option><option value="internal-medicine.html">internal-medicine.html</option><option value="liver.html">liver.html</option><option value="media-library.html">media-library.html</option><option value="medical-disclaimer.html">medical-disclaimer.html</option><option value="privacy.html">privacy.html</option><option value="search.html">search.html</option><option value="service-details.html">service-details.html</option><option value="services.html">services.html</option><option value="survey.html">survey.html</option><option value="videos.html">videos.html</option></select><p>اضغط على نص أو صورة في المعاينة لتعديلها، أو لإخفائها دون حذف الأصل.</p><small id="target">لم يتم اختيار عنصر</small><label>النص أو رابط الصورة</label><textarea id="value" disabled></textarea><button id="apply" disabled>تطبيق التعديل</button><button id="hide" disabled>إخفاء / إظهار</button><button id="undo" disabled>إلغاء تعديل العنصر</button><hr><h3>إضافة محتوى إلى الصفحة</h3><label>العنوان</label><input id="title" placeholder="عنوان القسم"><label>الوصف</label><textarea id="body" placeholder="المحتوى الجديد"></textarea><button id="add" disabled>إضافة قسم</button><h3>الأقسام المضافة</h3><div id="blocks"></div><hr><button id="reset" disabled>استعادة تعديلات الصفحة</button><p><small>لا يُحذف المحتوى الأصلي. الحذف هنا إخفاء قابل للاستعادة. يجب ضبط صلاحيات المحرر في Supabase قبل الحفظ.</small></p></aside><iframe id="preview" title="معاينة الموقع" src="index.html"></iframe></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const $=x=>document.getElementById(x),frame=$('preview');let patches=[],blocks=[],selected=null,ready=false;const selector=el=>{let arr=[];while(el&&el.nodeType===1&&el!==frame.contentDocument.documentElement){let n=1,s=el;while(s=s.previousElementSibling)if(s.tagName===el.tagName)n++;arr.unshift(el.tagName.toLowerCase()+':nth-of-type('+n+')');el=el.parentElement}return arr.join(' > ')};const key=()=> 'visual_page_'+$('page').value;function renderBlocks(){$('blocks').replaceChildren();blocks.forEach(b=>{const d=document.createElement('div'),t=document.createElement('span'),btn=document.createElement('button');t.textContent=b.title+' ';btn.textContent='حذف الإضافة';btn.onclick=()=>{blocks=blocks.filter(x=>x.id!==b.id);renderBlocks();refresh()};d.append(t,btn);$('blocks').append(d)})}function refresh(){frame.src=$('page').value}async function load(){selected=null;$('value').disabled=true;const r=await supabaseClient.from('site_sections').select('content').eq('section_key',key()).maybeSingle();if(r.error){$('msg').textContent=r.error.message;return}let d=r.data?.content;if(!d&&$('page').value==='index.html'){const old=await supabaseClient.from('site_sections').select('content').eq('section_key','homepage_visual_overrides').maybeSingle();d=old.data?.content}patches=structuredClone(d?.patches||[]);blocks=structuredClone(d?.blocks||[]);renderBlocks();refresh();$('msg').textContent='جاهز: '+$('page').value}function install(){let doc=frame.contentDocument;if(!doc||!ready)return;doc.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();let el=e.target;if(el.tagName!=='IMG'&&el.children.length){let leaf=[...el.querySelectorAll('*')].find(x=>!x.children.length&&x.textContent.trim());if(leaf)el=leaf}if(el.children.length&&el.tagName!=='IMG')return;selected={selector:selector(el),type:el.tagName==='IMG'?'image':'text',el};$('target').textContent=selected.selector;$('value').value=selected.type==='image'?el.getAttribute('src')||'':el.textContent;for(let id of ['value','apply','hide','undo'])$(id).disabled=false},true)}frame.addEventListener('load',install);$('page').onchange=load;$('apply').onclick=()=>{if(!selected)return;const v=$('value').value;if(selected.type==='image'&&!/^(https:\/\/|[\w./-]+$)/i.test(v)){alert('رابط الصورة غير صالح');return}patches=patches.filter(p=>p.selector!==selected.selector||p.type!==selected.type);patches.push({selector:selected.selector,type:selected.type,value:v});if(selected.type==='image')selected.el.src=v;else selected.el.textContent=v;$('msg').textContent='تعديل غير محفوظ'};$('hide').onclick=()=>{if(!selected)return;const old=patches.find(p=>p.selector===selected.selector&&p.type==='hidden');const value=!old?.value;patches=patches.filter(p=>p.selector!==selected.selector||p.type!=='hidden');patches.push({selector:selected.selector,type:'hidden',value});selected.el.style.display=value?'none':'';$('msg').textContent='إخفاء غير محفوظ'};$('undo').onclick=()=>{if(!selected)return;patches=patches.filter(p=>p.selector!==selected.selector);refresh()};$('add').onclick=()=>{const title=$('title').value.trim(),body=$('body').value.trim();if(!title&&!body)return;blocks.push({id:String(Date.now()),title,body});$('title').value='';$('body').value='';renderBlocks();refresh()};$('save').onclick=async()=>{const {error}=await supabaseClient.from('site_sections').upsert({section_key:key(),content:{patches,blocks},updated_at:new Date().toISOString()},{onConflict:'section_key'});$('msg').textContent=error?'فشل الحفظ: '+error.message:'تم الحفظ في قاعدة البيانات';};$('reset').onclick=()=>{if(!confirm('هل تريد إلغاء تعديلات هذه الصفحة فقط؟'))return;patches=[];blocks=[];renderBlocks();refresh();$('msg').textContent='اضغط حفظ ونشر لتثبيت الاستعادة'};(async()=>{if(typeof supabaseClient==='undefined'){$('msg').textContent='إعداد الاتصال غير متوفر';return}const {data:{session}}=await supabaseClient.auth.getSession();if(!session){location.href='admin.html';return}ready=true;for(let id of ['save','reset','add'])$(id).disabled=false;await load()})();
</script></html>
