<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المؤتمرات والفعاليات | عيادة الدكتور عبده الباسط</title><meta name="description" content="المؤتمرات والفعاليات العلمية والمهنية للدكتور عبده الباسط عبده الحاج مقبل."><link rel="stylesheet" href="site-theme.css?v=20260930"><link rel="stylesheet" href="site-enhancements.css?v=20260930"><style>body{font-family:Tahoma,Arial,sans-serif;margin:0;color:#17364e;background:#f7fafb}.container{width:92%;max-width:1180px;margin:auto}header{background:#fff;position:sticky;top:0;z-index:1000;border-bottom:1px solid #e3ebef}.nav{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#064b7c}.logo{width:58px;height:58px;object-fit:contain}.menu{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.menu a{text-decoration:none;color:#17364e;font-weight:700;font-size:13px}.hero{padding:72px 0;text-align:center;background:linear-gradient(135deg,#eef7fb,#f2f8ef)}.hero h1{color:#064b7c;font-size:38px;margin:0 0 8px}.section{padding:55px 0}.filters{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:25px}.filters button{border:1px solid #d9e6e9;background:#fff;padding:9px 16px;border-radius:999px;cursor:pointer}.filters button.active{background:#4c963d;color:#fff;border-color:#4c963d}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:#fff;border:1px solid #e3ebef;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.04)}.cover{height:210px;background:linear-gradient(135deg,#e8f5fb,#e4f1e3);display:flex;align-items:center;justify-content:center;color:#fff;font-size:42px}.cover img{width:100%;height:100%;object-fit:cover;display:block}.event-video{display:inline-block;margin-top:10px;color:#39792f;font-weight:700;text-decoration:none}.body{padding:20px}.badge{display:inline-block;background:#eef7f0;color:#3f7d38;border-radius:999px;padding:4px 10px;font-size:12px}.body h2{font-size:20px;color:#064b7c}.meta{color:#6d7c86;font-size:13px}footer{background:#073d68;color:#fff;padding:35px 0}.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:25px}@media(max-width:800px){.menu a:not(.book-nav){display:none}.grid{grid-template-columns:1fr}.hero h1{font-size:30px}.footer-grid{grid-template-columns:1fr}}</style><link rel="stylesheet" href="phase24.css?v=24"><link rel="stylesheet" href="phase27.css?v=27"><link rel="stylesheet" href="phase28.css?v=28"><link rel="stylesheet" href="phase29.css?v=29"><link rel="stylesheet" href="phase30.css?v=30"><link rel="stylesheet" href="phase31.css?v=31"><link rel="stylesheet" href="phase32.css?v=32"><link rel="stylesheet" href="phase48.css?v=48"></head><body><header><div class="container nav"><a class="brand" href="index.html"><img class="logo" src="logo.jpg?v=6" alt="شعار العيادة"><strong>عيادة الدكتور عبده الباسط</strong></a><nav class="menu"><a href="index.html">الرئيسية</a><a href="about.html">عن الدكتور</a><a href="events.html">المؤتمرات والفعاليات</a><a href="contact.html">تواصل معنا</a><a class="book-nav" href="booking.html">حجز موعد</a></nav></div></header><section class="hero"><div class="container"><h1>المؤتمرات والفعاليات</h1><p>المشاركة العلمية والفعاليات المهنية والتوعوية.</p></div></section><main class="section"><div class="container"><div class="filters"><button class="active" data-filter="all">الكل</button><button data-filter="upcoming">قادمة</button><button data-filter="current">حالية</button><button data-filter="past">سابقة</button></div><div class="phase48-event-filters"><input id="phase48-search" type="search" placeholder="ابحث باسم الفعالية أو المكان" aria-label="البحث في الفعاليات"><select id="phase48-sort" aria-label="ترتيب الفعاليات"><option value="new">الأحدث أولًا</option><option value="old">الأقدم أولًا</option><option value="name">حسب الاسم</option></select><span id="phase48-count" class="phase48-count" aria-live="polite"></span></div><div id="eventsGrid" class="grid"><div class="state-box skeleton" aria-label="جاري التحميل"></div><div class="state-box skeleton"></div><div class="state-box skeleton"></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="document.write('<script src=&quot;https://unpkg.com/@supabase/supabase-js@2&quot;><\/script>')"></script><script src="supabase-config.js"></script><script src="phase56-public.js?v=60"></script><script src="phase50-images.js?v=50"></script><script>let events=[];const grid=document.getElementById('eventsGrid');function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function normalizeEventImage(s){return window.phase50EventImageUrl?window.phase50EventImageUrl(s):''}function render(filter='all'){const query=(document.getElementById('phase48-search')?.value||'').trim().toLocaleLowerCase('ar');const sort=document.getElementById('phase48-sort')?.value||'new';let a=(filter==='all'?events:events.filter(x=>x.status===filter)).filter(x=>!query||[x.title_ar,x.place_ar,x.location_ar,x.description_ar].some(v=>String(v||'').toLocaleLowerCase('ar').includes(query)));a=[...a].sort((x,y)=>sort==='name'?String(x.title_ar||'').localeCompare(String(y.title_ar||''),'ar'):sort==='old'?String(x.event_date||'').localeCompare(String(y.event_date||'')):String(y.event_date||'').localeCompare(String(x.event_date||'')));document.getElementById('phase48-count').textContent=a.length+' فعالية';grid.innerHTML=a.length?a.map(x=>{const src=normalizeEventImage(x.cover_url);return `<article class="card"><div class="cover">${src?`<img class="phase48-zoom" tabindex="0" role="button" aria-label="تكبير صورة الفعالية" src="${esc(src)}" alt="${esc(x.title_ar||'')}" loading="lazy" decoding="async" onerror="window.phase50EventImageFailed(this)">`:'✦'}</div><div class="body"><span class="badge">${x.status==='upcoming'?'قادمة':x.status==='current'?'حالية':'سابقة'}</span><h2>${esc(x.title_ar)}</h2><p class="meta">${esc(x.event_date||'')} ${(x.place_ar||x.location_ar)?'• '+esc(x.place_ar||x.location_ar):''}</p><p>${esc(x.description_ar||'')}</p>${x.video_url?`<a class="event-video" href="${esc(x.video_url)}" target="_blank" rel="noopener noreferrer">مشاهدة الفيديو ↗</a>`:''}</div></article>`}).join(''):'<div class="state-box">لا توجد فعاليات منشورة في هذا التصنيف حاليًا.</div>'}async function load(){try{const{data,error}=await supabaseClient.from('events').select('*').eq('is_published',true).order('event_date',{ascending:false});if(error)throw error;events=await window.phase56Filter('events',data||[]);render()}catch(e){grid.innerHTML='<div class="state-box">تعذر تحميل الفعاليات الآن.<br><button onclick="load()">إعادة المحاولة</button></div>'}}document.getElementById('phase48-search').addEventListener('input',()=>render(document.querySelector('[data-filter].active')?.dataset.filter||'all'));document.getElementById('phase48-sort').addEventListener('change',()=>render(document.querySelector('[data-filter].active')?.dataset.filter||'all'));document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.filter)});load();const box=document.createElement('div');box.className='phase48-lightbox';box.hidden=true;box.setAttribute('role','dialog');box.setAttribute('aria-modal','true');box.setAttribute('aria-label','صورة الفعالية');box.innerHTML='<button type="button" aria-label="إغلاق الصورة">×</button><figure><img alt=""><figcaption></figcaption></figure>';document.body.append(box);const shut=()=>{box.hidden=true;document.body.style.overflow='';};box.querySelector('button').onclick=shut;box.addEventListener('click',e=>{if(e.target===box)shut()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!box.hidden)shut();else if((e.key==='Enter'||e.key===' ')&&e.target.matches('.phase48-zoom')){e.preventDefault();e.target.click();}});grid.addEventListener('click',e=>{const img=e.target.closest('.phase48-zoom');if(!img)return;box.querySelector('img').src=img.currentSrc||img.src;box.querySelector('img').alt=img.alt;box.querySelector('figcaption').textContent=img.alt;box.hidden=false;document.body.style.overflow='hidden';box.querySelector('button').focus()});</script><script src="site-enhancements.js?v=20260930"></script><script src="interface-public.js" defer></script><script src="phase24.js?v=24" defer></script><script src="phase27.js?v=27" defer></script><script src="phase28.js?v=28" defer></script><script src="phase29.js?v=29" defer></script><script src="phase30.js?v=30" defer></script><script src="phase31.js?v=31" defer></script><script defer src="phase32.js?v=32"></script><script defer src="page-visibility.js?v=37"></script></body></html>
