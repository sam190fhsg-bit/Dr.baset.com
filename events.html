ck;background:#eef7f0;color:#3f7d38;border-radius:999px;padding:4px 10px;font-size:12px}.body h2{font-size:20px;color:#064b7c}.meta{color:#6d7c86;font-size:13px}footer{background:#073d68;color:#fff;padding:35px 0}.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:25px}@media(max-width:800px){.menu a:not(.book-nav){display:none}.grid{grid-template-columns:1fr}.hero h1{font-size:30px}.footer-grid{grid-template-columns:1fr}}</style><link rel="stylesheet" href="phase24.css?v=24"><link rel="stylesheet" href="phase27.css?v=27"><link rel="stylesheet" href="phase28.css?v=28"><link rel="stylesheet" href="phase29.css?v=29"><link rel="stylesheet" href="phase30.css?v=30"><link rel="stylesheet" href="phase31.css?v=31"><link rel="stylesheet" href="phase32.css?v=32"></head><body><header><div class="container nav"><a class="brand" href="index.html"><img class="logo" src="logo.jpg?v=6" alt="شعار العيادة"><strong>عيادة الدكتور عبده الباسط</strong></a><nav class="menu"><a href="index.html">الرئيسية</a><a href="about.html">عن الدكتور</a><a href="events.html">المؤتمرات والفعاليات</a><a href="contact.html">تواصل معنا</a><a class="book-nav" href="booking.html">حجز موعد</a></nav></div></header><section class="hero"><div class="container"><h1>المؤتمرات والفعاليات</h1><p>المشاركة العلمية والفعاليات المهنية والتوعوية.</p></div></section><main class="section"><div class="container"><div class="filters"><button class="active" data-filter="all">الكل</button><button data-filter="upcoming">قادمة</button><button data-filter="current">حالية</button><button data-filter="past">سابقة</button></div><div id="eventsGrid" class="grid"><div class="state-box skeleton" aria-label="جاري التحميل"></div><div class="state-box skeleton"></div><div class="state-box skeleton"></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="document.write('<script src=&quot;https://unpkg.com/@supabase/supabase-js@2&quot;><\/script>')"></script><script src="supabase-config.js"></script><script>let events=[];const grid=document.getElementById('eventsGrid');function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(filter='all'){const a=filter==='all'?events:events.filter(x=>x.status===filter);grid.innerHTML=a.length?a.map(x=>`<article class="card"><div class="cover">${x.cover_url?`<img src="${esc(x.cover_url)}" alt="${esc(x.title_ar||'')}" loading="lazy">`:'✦'}</div><div class="body"><span class="badge">${x.status==='upcoming'?'قادمة':x.status==='current'?'حالية':'سابقة'}</span><h2>${esc(x.title_ar)}</h2><p class="meta">${esc(x.event_date||'')} ${(x.place_ar||x.location_ar)?'• '+esc(x.place_ar||x.location_ar):''}</p><p>${esc(x.description_ar||'')}</p>${x.video_url?`<a class="event-video" href="${esc(x.video_url)}" target="_blank" rel="noopener noreferrer">مشاهدة الفيديو ↗</a>`:''}</div></article>`).join(''):'<div class="state-box">لا توجد فعاليات منشورة في هذا التصنيف حاليًا.</div>'}async function load(){try{const{data,error}=await supabaseClient.from('events').select('*').eq('is_published',true).order('event_date',{ascending:false});if(error)throw error;events=data||[];render()}catch(e){grid.innerHTML='<div class="state-box">تعذر تحميل الفعاليات الآن.<br><button onclick="load()">إعادة المحاولة</button></div>'}}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.filter)});load();</script><script src="site-enhancements.js?v=20260930"></script><script src="interface-public.js" defer></script><script src="phase24.js?v=24" defer></script><script src="phase27.js?v=27" defer></script><script src="phase28.js?v=28" defer></script><script src="phase29.js?v=29" defer></script><script src="phase30.js?v=30" defer></script><script src="phase31.js?v=31" defer></script><script defer src="phase32.js?v=32"></script><script defer src="page-visibility.js?v=37"></script></body></html>
