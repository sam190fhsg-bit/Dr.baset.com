<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جميع الحالات المرضية | عيادة الدكتور عبده الباسط</title><meta name="description" content="دليل الحالات المرضية في الباطنة والكبد والجهاز الهضمي والمناظير."><link rel="stylesheet" href="site-theme.css"><link rel="stylesheet" href="site-enhancements.css"><style>
body{background:#f6fafc;color:#123b55}.conditions-hero{padding:55px 0 30px;text-align:center}.conditions-hero h1{margin:0 0 8px;color:#0b557d}.conditions-wrap{width:min(1180px,92%);margin:auto;padding-bottom:60px}.condition-tools{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:0 0 28px}.condition-tools input{width:min(480px,100%);padding:14px 18px;border:1px solid #d8e4e8;border-radius:14px;font:inherit;background:white}.filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.filter{border:1px solid #dbe8e4;background:#fff;padding:10px 15px;border-radius:999px;cursor:pointer;color:#155a78}.filter.active{background:#4d9c48;color:white;border-color:#4d9c48}.condition-section{margin:34px 0}.condition-section h2{font-size:24px;color:#0b557d;border-right:4px solid #54a64b;padding-right:12px}.condition-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.condition-card{background:white;border:1px solid #e2ecef;border-radius:18px;padding:20px 14px;text-align:center;min-height:155px;box-shadow:0 8px 24px rgba(20,70,90,.05);transition:.2s}.condition-card:hover{transform:translateY(-4px)}.condition-image{width:100%;height:112px;border-radius:14px;display:block;margin:0 auto 12px;object-fit:cover;background:#edf7f1}.condition-card h3{font-size:15px;margin:0 0 8px}.condition-card span{color:#4d9c48;font-size:13px}.state{grid-column:1/-1;text-align:center;padding:35px;background:white;border-radius:18px}.state button{padding:10px 18px;border:0;border-radius:10px;background:#4d9c48;color:white}@media(max-width:900px){.condition-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:620px){.condition-grid{grid-template-columns:repeat(2,1fr);gap:10px}.condition-card{padding:16px 9px;min-height:140px}.conditions-hero{padding-top:35px}}
</style><link rel="stylesheet" href="phase24.css?v=24"><link rel="stylesheet" href="phase27.css?v=27"><link rel="stylesheet" href="phase28.css?v=28"><link rel="stylesheet" href="phase29.css?v=29"><link rel="stylesheet" href="phase30.css?v=30"><link rel="stylesheet" href="phase31.css?v=31"><link rel="stylesheet" href="phase32.css?v=32"></head><body>
<header><div class="container nav"><a class="brand" href="index.html"><img src="logo.jpg" alt="شعار العيادة"><div><b>عيادة الدكتور عبده الباسط عبده الحاج مقبل</b><small>الباطنة والكبد ومناظير الجهاز الهضمي</small></div></a><a class="btn btn-green" href="booking.html">احجز موعدك</a></div></header>
<main><section class="conditions-hero"><div class="conditions-wrap"><h1>جميع الحالات المرضية</h1><p>تصفح الحالات حسب التخصص أو ابحث باسم الحالة.</p></div></section><div class="conditions-wrap"><div class="condition-tools"><input id="q" type="search" placeholder="ابحث عن حالة مرضية..." aria-label="البحث في الحالات المرضية"><div class="filters"><button class="filter active" data-cat="all">الكل</button><button class="filter" data-cat="internal-medicine">الباطنة</button><button class="filter" data-cat="liver">الكبد</button><button class="filter" data-cat="gastroenterology">الجهاز الهضمي</button><button class="filter" data-cat="endoscopy">المناظير</button></div></div><div id="conditionsRoot"><div class="state">جاري تحميل الحالات المرضية...</div></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const root=document.getElementById('conditionsRoot'),q=document.getElementById('q');let all=[],cat='all';
const labels={'internal-medicine':'أمراض الباطنة','liver':'أمراض الكبد','gastroenterology':'أمراض الجهاز الهضمي','endoscopy':'المناظير'};
const fallbackMap={liver:'liver-slide.svg','internal-medicine':'internal-slide.svg',gastroenterology:'gastro-slide.svg',endoscopy:'endoscopy-slide.svg'};
const esc=s=>String(s||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function render(){let term=q.value.trim().toLowerCase(),rows=all.filter(x=>(cat==='all'||x.category===cat)&&(!term||String(x.title_ar||'').toLowerCase().includes(term)));if(!rows.length){root.innerHTML='<div class="state">لا توجد نتائج مطابقة.</div>';return;}let groups={};rows.forEach(x=>(groups[x.category]??=[]).push(x));root.innerHTML=Object.entries(groups).map(([c,items])=>`<section class="condition-section"><h2>${labels[c]||'حالات مرضية'}</h2><div class="condition-grid">${items.map(x=>`<a class="condition-card" href="disease.html?slug=${encodeURIComponent(x.slug)}"><img class="condition-image" src="${esc(x.image_url||fallbackMap[c]||'gastro-slide.svg')}" alt="${esc(x.title_ar)}" loading="lazy" onerror="this.onerror=null;this.src='gastro-slide.svg'"><h3>${esc(x.title_ar)}</h3><span>عرض التفاصيل</span></a>`).join('')}</div></section>`).join('')}
async function load(){root.innerHTML='<div class="state">جاري تحميل الحالات المرضية...</div>';try{const {data,error}=await supabaseClient.from('diseases').select('slug,title_ar,category,sort_order,image_url').eq('is_published',true).order('sort_order',{ascending:true});if(error)throw error;all=data||[];if(!all.length){root.innerHTML='<div class="state">لا توجد حالات مرضية منشورة حاليًا.</div>';return}render()}catch(e){root.innerHTML='<div class="state">تعذر تحميل الحالات المرضية الآن.<br><button onclick="load()">إعادة المحاولة</button></div>'}}
q.addEventListener('input',render);document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');cat=b.dataset.cat;render()});load();
</script><script src="site-enhancements.js"></script><script src="interface-public.js" defer></script><script src="phase24.js?v=24" defer></script><script src="phase27.js?v=27" defer></script><script src="phase28.js?v=28" defer></script><script src="phase29.js?v=29" defer></script><script src="phase30.js?v=30" defer></script><script src="phase31.js?v=31" defer></script><script defer src="phase32.js?v=32"></script><script defer src="page-visibility.js?v=37"></script></body></html>
