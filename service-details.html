footer{

.footer-grid{

footer a{

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>

const params = new URLSearchParams(window.location.search);
const slug = params.get('slug');

const titleElement =
  document.getElementById('serviceTitle');

const descriptionElement =
  document.getElementById('serviceDescription');

const contentElement =
  document.getElementById('serviceContent');

function escapeHTML(value = '') {
  return String(value)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'",'&#039;');
}

async function loadService(){

if(!slug){

  titleElement.textContent =
    'الخدمة غير محددة';

  contentElement.innerHTML = `
    <div class="status">
      لم يتم تحديد الخدمة المطلوبة.
      <br><br>
      <a class="btn btn-primary"
         href="services.html">
         العودة إلى الخدمات
      </a>
    </div>
  `;

  return;
}


const { data, error } = await supabaseClient.from('services')
  .select(`
    slug,
    title_ar,
    short_description_ar,
    body_ar,
    is_published
  `)
  .eq('slug',slug)
  .eq('is_published',true)
  .maybeSingle();


if(error){

  console.error(error);

  titleElement.textContent =
    'تعذر تحميل الخدمة';

  contentElement.innerHTML = `
    <div class="status">
      حدث خطأ أثناء تحميل البيانات.
    </div>
  `;

  return;
}


if(!data){

  titleElement.textContent =
    'الخدمة غير موجودة';

  descriptionElement.textContent = '';

  contentElement.innerHTML = `
    <div class="status">
      لم نعثر على الخدمة المطلوبة.
      <br><br>

      <a class="btn btn-primary"
         href="services.html">
         العودة إلى الخدمات
      </a>
    </div>
  `;

  return;
}


const title =
  data.title_ar || 'الخدمة الطبية';

const shortDescription =
  data.short_description_ar || '';

const body =
  data.body_ar || shortDescription;


document.title =
  `${title} | عيادة الدكتور عبده الباسط`;


document
  .getElementById('metaDescription')
  .setAttribute(
    'content',
    shortDescription ||
    `معلومات عن ${title}`
  );


titleElement.textContent =
  title;

descriptionElement.textContent =
  shortDescription;


contentElement.innerHTML = `

<div class="content-card">

<h2>
${escapeHTML(title)}
</h2>

<div class="service-body">
${escapeHTML(body)}
</div>


<div class="info-box">

<strong>تنبيه طبي:</strong>

المعلومات الواردة في الموقع للتوعية العامة
ولا تُغني عن التقييم الطبي المباشر أو التشخيص
من قبل الطبيب.

</div>


<div class="actions">

<a
href="booking.html"
class="btn btn-primary">
احجز موعدك
</a>

<a
href="services.html"
class="btn btn-light">
العودة إلى الخدمات
</a>

</div>

</div>
`;

}


loadService();

</script>
