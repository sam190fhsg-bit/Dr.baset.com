<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تفاصيل المقال | العيادة</title><link rel="stylesheet" href="site-theme.css?v=20"><style>body{font-family:Tahoma,Arial,sans-serif;background:#f7faf8;color:#17364e;margin:0;line-height:2}.wrap{max-width:850px;margin:35px auto;padding:25px;background:#fff;border-radius:18px}header{padding:16px;background:white}a{color:#477537}img{max-width:100%;border-radius:14px}.body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:17px}h1{line-height:1.6}</style><link rel="stylesheet" href="phase24.css?v=24"><link rel="stylesheet" href="phase27.css?v=27"><link rel="stylesheet" href="phase28.css?v=28"><link rel="stylesheet" href="phase29.css?v=29"><link rel="stylesheet" href="phase30.css?v=30"><link rel="stylesheet" href="phase31.css?v=31"><link rel="stylesheet" href="phase32.css?v=32"></head><body><header><a href="articles.html">← العودة إلى التوعية الصحية والمقالات</a></header><main class="wrap" id="content" aria-live="polite">جارٍ تحميل المقال...</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>(async()=>{const box=document.getElementById('content'),slug=new URLSearchParams(location.search).get('slug');if(!slug){box.textContent='لم يتم تحديد المقال.';return}try{const {data,error}=await supabaseClient.from('articles').select('*').eq('slug',slug).eq('is_published',true).maybeSingle();if(error)throw error;if(!data){box.textContent='المقال غير موجود أو غير منشور.';return}box.replaceChildren();const h=document.createElement('h1');h.textContent=data.title_ar||'مقال طبي';box.append(h);if(data.cover_url&&/^https?:\/\//i.test(data.cover_url)){const img=document.createElement('img');img.src=data.cover_url;img.alt=data.title_ar||'';img.loading='lazy';box.append(img)}const b=document.createElement('div');b.className='body';b.textContent=data.body_ar||data.content_ar
