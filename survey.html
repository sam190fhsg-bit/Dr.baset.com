<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="site-theme.css?v=20"><style>body{font-family:Tahoma,Arial,sans-serif;margin:0;color:#17364e;background:#fff}.container{width:92%;max-width:1100px;margin:auto}.simple-head{background:#fff;border-bottom:1px solid #e3ebef}.simple-nav{min-height:82px;display:flex;align-items:center;justify-content:space-between;gap:20px}.simple-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#064b7c;font-weight:bold}.simple-brand img{width:56px;height:56px;object-fit:contain}.simple-links{display:flex;gap:13px;flex-wrap:wrap}.simple-links a{text-decoration:none;color:#284658;font-size:13px}.simple-links .book{background:#4c963d;color:#fff;padding:8px 13px;border-radius:7px}.pagehero{padding:55px 0;text-align:center;background:linear-gradient(135deg,#edf6fa,#f2f8ef)}.pagehero h1{color:#064b7c;font-size:34px;margin:0 0 8px}.pagehero p{color:#687985}.pagebody{padding:50px 0}.foot{background:#063d67;color:#fff;padding:30px 0;margin-top:40px}.foot a{color:#d8e5ed;text-decoration:none;margin-left:12px}@media(max-width:850px){.simple-links{display:none}}</style><title>استبيان رضا المراجعين | عيادة الدكتور عبده الباسط</title><link rel="stylesheet" href="phase24.css?v=24"><link rel="stylesheet" href="phase27.css?v=27"><link rel="stylesheet" href="phase28.css?v=28"><link rel="stylesheet" href="phase29.css?v=29"><link rel="stylesheet" href="phase30.css?v=30"><link rel="stylesheet" href="phase31.css?v=31"><link rel="stylesheet" href="phase32.css?v=32"></head><body><header class="simple-head"><div class="container simple-nav"><a class="simple-brand" href="index.html"><img src="logo.jpg" alt="شعار العيادة"><span>عيادة الدكتور عبده الباسط عبده الحاج مقبل</span></a><nav class="simple-links"><a href="index.html">الرئيسية</a><a href="about.html">عن الدكتور</a><a href="services.html">الخدمات</a><a href="videos.html">ا rm></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>document.getElementById('surveyForm').addEventListener('submit',async e=>{e.preventDefault();const st=document.getElementById('surveyStatus');st.textContent='جاري الإرسال...';const o=Object.fromEntries(new FormData(e.target));['reception_rating','booking_rating','waiting_rating','overall_rating'].forEach(k=>o[k]=Number(o[k]));o.would_recommend=o.would_recommend==='true';const {error}=await supabaseClient.from('survey_responses').insert(o);st.textContent=error?'تعذر الإرسال. تأكد من تنفيذ ملف إعداد قاعدة البيانات.':'شكرًا لك، تم إرسال الاستبيان بنجاح.';if(!error)e.target.reset()})</script></div></main><script src="site-enhancements.js?v=20260930"></script>
