<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>إدارة محتوى الموقع</title><link rel="stylesheet" href="site-theme.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f8fa;font-family:Tahoma,Arial;color:#17394d}.wrap{max-width:1180px;margin:auto;padding:18px}.top,.tabs,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.card{background:#fff;border:1px solid #dfe9ed;border-radius:16px;padding:18px;margin:14px 0}.tabs button,.btn{border:0;border-radius:9px;padding:10px 14px;cursor:pointer}.tabs button.active,.primary{background:#4c963d;color:#fff}.secondary{background:#e9f2f6;color:#064b7c}.danger{background:#fff0f0;color:#a32727}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.form input,.form textarea,.form select{width:100%;padding:11px;border:1px solid #d6e2e7;border-radius:9px;font:inherit}.form textarea{min-height:90px}.full{grid-column:1/-1}.list{display:grid;gap:10px}.row{border:1px solid #e1eaed;border-radius:12px;padding:12px;display:flex;justify-content:space-between;gap:12px;align-items:center}.row small{display:block;color:#667}.state{padding:18px;text-align:center;color:#667}@media(max-width:650px){.form{grid-template-columns:1fr}.full{grid-column:auto}.row{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div><h1>إدارة محتوى الموقع</h1><p>السلايدر والفعاليات والفيديوهات وأوقات الدوام وروابط التواصل.</p></div><a class="btn secondary" href="admin.html">العودة للوحة الإدارة</a></div><div id="gate" class="card">جارٍ التحقق من الصلاحية...</div><section id="app" hidden><div class="tabs" id="tabs"><button data-tab="sliders" class="active">السلايدر</button><button data-tab="events">الفعاليات</button><button data-tab="videos">الفيديوهات</button><button data-tab="hours">الدوام</button><button data-tab="social">التواصل</button></div><div id="editor" class="card"></div><div class="card"><h2>المحتوى الحالي</h2><div id="list" class="list"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let tab='sliders',rows=[];
const defs={
sliders:{table:'sliders',title:'شريحة السلايدر',order:'sort_order',fields:[['title_ar','العنوان','text'],['eyebrow_ar','عنوان صغير','text'],['subtitle_ar','عنوان فرعي','text'],['description_ar','الوصف','textarea'],['image_url','رابط الصورة (يمكن ربطها من مكتبة الوسائط)','url'],['button_text_ar','نص الزر','text'],['button_url','رابط الزر','text'],['sort_order','الترتيب','number'],['is_published','منشور','check']]},
events:{table:'events',title:'فعالية',order:'event_date',fields:[['title_ar','اسم الفعالية','text'],['event_date','التاريخ','date'],['place_ar','المكان','text'],['description_ar','الوصف','textarea'],['cover_url','صورة الغلاف','url'],['video_url','رابط الفيديو','url'],['status','الحالة upcoming/current/past','text'],['is_published','منشور','check']]},
videos:{table:'videos',title:'فيديو',order:'sort_order',fields:[['title_ar','العنوان','text'],['description_ar','الوصف','textarea'],['video_url','رابط الفيديو','url'],['sort_order','الترتيب','number'],['is_published','منشور','check']]},
hours:{table:'working_hours',title:'يوم',order:'sort_order',fields:[['day_key','مفتاح اليوم','text'],['label_ar','اسم اليوم','text'],['morning_from','بداية الصباح','time'],['morning_to','نهاية الصباح','time'],['evening_from','بداية المساء','time'],['evening_to','نهاية المساء','time'],['is_closed','إجازة','check'],['sort_order','الترتيب','number']]},
social:{table:'social_links',title:'رابط تواصل',order:'sort_order',fields:[['platform','المنصة','text'],['url','الرابط','url'],['is_published','منشور','check'],['sort_order','الترتيب','number']]}}
async function init(){const {data:{session}}=await supabaseClient.auth.getSession();if(!session){$('gate').innerHTML='يجب <a href="admin.html">تسجيل الدخول</a> أولًا.';return}const {data:ok}=await supabaseClient.rpc('is_content_editor');if(ok!==true){$('gate').textContent='لا توجد صلاحية لإدارة المحتوى.';return}$('gate').hidden=true;$('app').hidden=false;renderForm();load()}
function renderForm(x={}){const d=defs[tab];$('editor').innerHTML=`<h2>${x.id?'تعديل':'إضافة'} ${d.title}</h2><div class="form">${d.fields.map(f=>{const [k,l,t]=f,v=x[k]??'';if(t==='textarea')return `<textarea class="full" data-k="${k}" placeholder="${l}">${esc(v)}</textarea>`;if(t==='check')return `<label><input data-k="${k}" type="checkbox" ${v===true||(!x.id&&k==='is_published')?'checked':''}> ${l}</label>`;return `<input data-k="${k}" type="${t}" value="${esc(v)}" placeholder="${l}">`}).join('')}</div><div class="actions" style="margin-top:12px"><button class="btn primary" id="save">${x.id?'حفظ التعديل':'إضافة'}</button>${x.id?'<button class="btn secondary" id="cancel">إلغاء</button>':''}<span id="msg"></span></div>`;$('save').onclick=()=>save(x.id);if(x.id)$('cancel').onclick=()=>renderForm()}
async function load(){const d=defs[tab];$('list').innerHTML='<div class="state">جارٍ التحميل...</div>';let q=supabaseClient.from(d.table).select('*');if(d.order)q=q.order(d.order,{ascending:true});const {data,error}=await q.limit(300);if(error){$('list').innerHTML='<div class="state">تعذر تحميل البيانات. شغّل PHASE5 أولًا ثم أعد المحاولة.</div>';return}rows=data||[];$('list').innerHTML=rows.map(x=>`<div class="row"><div><strong>${esc(x.title_ar||x.label_ar||x.platform||x.day_key||'عنصر')}</strong><small>${esc(x.description_ar||x.url||x.video_url||'')}</small></div><div class="actions"><button class="btn secondary" onclick="edit('${x.id}')">تعديل</button><button class="btn danger" onclick="del('${x.id}')">حذف</button></div></div>`).join('')||'<div class="state">لا توجد بيانات بعد.</div>'}
async function save(id){const d=defs[tab],obj={};document.querySelectorAll('#editor [data-k]').forEach(el=>{let v=el.type==='checkbox'?el.checked:el.value.trim();if(el.type==='number')v=v===''?0:Number(v);if(el.type==='time'&&v==='')v=null;obj[el.dataset.k]=v});$('msg').textContent='جارٍ الحفظ...';let r=id?await supabaseClient.from(d.table).update(obj).eq('id',id):await supabaseClient.from(d.table).insert(obj);if(r.error){$('msg').textContent='تعذر الحفظ: '+r.error.message;return}$('msg').textContent='تم الحفظ.';renderForm();load()}
window.edit=id=>{const x=rows.find(r=>String(r.id)===String(id));if(x)renderForm(x)};window.del=async id=>{if(!confirm('هل تريد حذف هذا العنصر؟'))return;const {error}=await supabaseClient.from(defs[tab].table).delete().eq('id',id);if(error)alert('تعذر الحذف: '+error.message);else load()};$('tabs').onclick=e=>{if(e.target.dataset.tab){tab=e.target.dataset.tab;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));renderForm();load()}};init();
</script></body></html>
