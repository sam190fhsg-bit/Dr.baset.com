<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>إدارة محتوى الموقع</title><link rel="stylesheet" href="site-theme.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f8fa;font-family:Tahoma,Arial;color:#17394d}.wrap{max-width:1180px;margin:auto;padding:18px}.top,.tabs,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.card{background:#fff;border:1px solid #dfe9ed;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 8px 24px rgba(0,50,75,.04)}.tabs button,.btn{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font:inherit}.tabs button.active,.primary{background:#4c963d;color:#fff}.secondary{background:#e9f2f6;color:#064b7c}.danger{background:#fff0f0;color:#a32727}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.form input,.form textarea,.form select{width:100%;padding:11px;border:1px solid #d6e2e7;border-radius:9px;font:inherit;background:#fff}.form textarea{min-height:90px}.full{grid-column:1/-1}.list{display:grid;gap:10px}.row{border:1px solid #e1eaed;border-radius:12px;padding:12px;display:flex;justify-content:space-between;gap:12px;align-items:center}.row-main{display:flex;gap:12px;align-items:center}.thumb{width:92px;height:62px;object-fit:cover;border-radius:9px;background:#eef3f5}.row small{display:block;color:#667;margin-top:4px}.state{padding:18px;text-align:center;color:#667}.media-picker{grid-column:1/-1;border:1px solid #dce8ec;border-radius:12px;padding:12px;background:#f8fbfc}.media-picker-grid{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center}.media-preview{width:120px;height:85px;object-fit:cover;border-radius:10px;background:#eef3f5;display:none}.hint{font-size:13px;color:#667;margin:5px 0}.success{color:#39792f}.error{color:#a32727}@media(max-width:650px){.form{grid-template-columns:1fr}.full,.media-picker{grid-column:auto}.row{align-items:flex-start;flex-direction:column}.row-main{align-items:flex-start}.media-picker-grid{grid-template-columns:1fr}.media-preview{width:100%;height:160px}.tabs{overflow:auto;flex-wrap:nowrap}.tabs button{white-space:nowrap}}
</style><link rel="stylesheet" href="phase24.css?v=24"><link rel="stylesheet" href="phase31.css?v=31"><link rel="stylesheet" href="phase32.css?v=32"><link rel="stylesheet" href="phase46-admin-tools.css?v=46"></head><body data-phase46="content"><main class="wrap"><div class="top"><div><h1>إدارة محتوى الموقع</h1><p>السلايدر والفعاليات والفيديوهات وأوقات الدوام وروابط التواصل.</p></div><a class="btn secondary" href="admin.html">العودة للوحة الإدارة</a></div><div id="gate" class="card">جارٍ التحقق من الصلاحية...</div><section id="app" hidden><div class="tabs" id="tabs"><button data-tab="sliders" class="active">السلايدر</button><button data-tab="events">الفعاليات</button><button data-tab="videos">الفيديوهات</button><button data-tab="hours">الدوام</button><button data-tab="social">التواصل</button></div><div id="editor" class="card"></div><div class="card"><h2>المحتوى الحالي</h2><div id="list" class="list"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="document.write('<script src=&quot;https://unpkg.com/@supabase/supabase-js@2&quot;><\/script>')"></script><script src="supabase-config.js"></script><script>
const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let tab='sliders',rows=[],sliderMedia=[],eventMedia=[];
const defs={
sliders:{table:'sliders',title:'شريحة السلايدر',order:'sort_order',fields:[['title_ar','العنوان','text'],['eyebrow_ar','عنوان صغير','text'],['subtitle_ar','عنوان فرعي','text'],['description_ar','الوصف','textarea'],['image_url','رابط الصورة','url'],['_button_text','نص الزر','text'],['_button_url','رابط الزر','text'],['sort_order','الترتيب','number'],['is_published','منشور','check']]},
events:{table:'events',title:'فعالية',order:'event_date',fields:[['title_ar','اسم الفعالية','text'],['event_date','التاريخ','date'],['place_ar','المكان','text'],['description_ar','الوصف','textarea'],['cover_url','صورة الغلاف','url'],['video_url','رابط الفيديو','url'],['status','الحالة upcoming/current/past','text'],['is_published','منشور','check']]},
videos:{table:'videos',title:'فيديو',order:'sort_order',fields:[['title_ar','العنوان','text'],['description_ar','الوصف','textarea'],['video_url','رابط الفيديو','url'],['sort_order','الترتيب','number'],['is_published','منشور','check']]},
hours:{table:'working_hours',title:'يوم',order:'sort_order',fields:[['day_key','مفتاح اليوم','text'],['label_ar','اسم اليوم','text'],['morning_from','بداية الصباح','time'],['morning_to','نهاية الصباح','time'],['evening_from','بداية المساء','time'],['evening_to','نهاية المساء','time'],['is_closed','إجازة','check'],['sort_order','الترتيب','number']]},
social:{table:'social_links',title:'رابط تواصل',order:'sort_order',fields:[['platform','المنصة','text'],['url','الرابط','url'],['is_published','منشور','check'],['sort_order','الترتيب','number']]}}
async function init(){if(!supabaseClient){$('gate').textContent='تعذّر الاتصال بمكتبة Supabase. جرّب صفحة التشخيص أو تحديث الاتصال.';return;}const wanted=location.hash.replace('#','');if(defs[wanted]){tab=wanted;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));}const {data:{session}}=await supabaseClient.auth.getSession();if(!session){$('gate').innerHTML='يجب <a href="admin.html">تسجيل الدخول</a> أولًا.';return}const {data:ok,error}=await supabaseClient.rpc('is_content_editor');if(error||ok!==true){$('gate').textContent='لا توجد صلاحية لإدارة المحتوى.';return}$('gate').hidden=true;$('app').hidden=false;await loadSliderMedia();await loadEventMedia();renderForm();load()}
async function loadSliderMedia(){const {data}=await supabaseClient.from('media').select('id,url,title,alt_text,caption,category').eq('category','slider').is('deleted_at',null).order('created_at',{ascending:false}).limit(200);sliderMedia=data||[]}
async function loadEventMedia(){const {data}=await supabaseClient.from('media').select('id,url,title,alt_text,category').is('deleted_at',null).order('created_at',{ascending:false}).limit(500);eventMedia=(data||[]).filter(m=>['events','event','gallery','general'].includes(m.category))}
function renderForm(x={}){const d=defs[tab],view={...x};if(tab==='sliders'){view._button_text=x.button_text_ar||x.cta_ar||'';view._button_url=x.button_url||x.target_url||''}
 let fields=d.fields.map(f=>{const [k,l,t]=f,v=view[k]??'';if(t==='textarea')return `<textarea class="full" data-k="${k}" placeholder="${l}">${esc(v)}</textarea>`;if(t==='check')return `<label><input data-k="${k}" type="checkbox" ${v===true||(!x.id&&k==='is_published')?'checked':''}> ${l}</label>`;return `<input data-k="${k}" type="${t}" value="${esc(v)}" placeholder="${l}">`}).join('');
 if(tab==='events')fields=`<div class="media-picker"><strong>رفع صورة الفعالية مباشرة</strong><input id="eventUpload" type="file" accept="image/*"><button type="button" id="uploadEventImage" class="btn secondary">رفع الصورة</button><span id="uploadEventMsg"></span></div><div class="media-picker"><strong>أو اختر صورة الفعالية من المكتبة</strong><select id="eventMediaSelect"><option value="">اختر صورة...</option>${eventMedia.map(m=>`<option value="${esc(m.url)}">${esc(m.title||m.alt_text||'صورة')}</option>`).join('')}</select><a href="media-library.html">إدارة الصور</a></div>`+fields;
 if(tab==='sliders')fields=`<div class="media-picker"><strong>اختيار صورة من مكتبة الوسائط</strong><p class="hint">اختر صورة مصنفة «السلايدر». لا تحتاج إلى نسخ الرابط يدويًا.</p><div class="media-picker-grid"><img id="mediaPreview" class="media-preview" alt="معاينة"><select id="mediaSelect"><option value="">اختر صورة من المكتبة...</option>${sliderMedia.map(m=>`<option value="${esc(m.url)}">${esc(m.title||m.alt_text||'صورة سلايدر')}</option>`).join('')}</select></div><p class="hint"><a href="media-library.html">فتح مكتبة الوسائط</a></p></div>`+fields;
 $('editor').innerHTML=`<h2>${x.id?'تعديل':'إضافة'} ${d.title}</h2><div class="form">${fields}</div><div class="actions" style="margin-top:12px"><button class="btn primary" id="save">${x.id?'حفظ التعديل':'إضافة'}</button>${x.id?'<button class="btn secondary" id="cancel">إلغاء</button>':''}<span id="msg"></span></div>`;
 if(tab==='events'){const sel=$('eventMediaSelect');sel.onchange=()=>{if(sel.value)document.querySelector('#editor [data-k=cover_url]').value=sel.value};const up=$('uploadEventImage');if(up)up.onclick=async()=>{const f=$('eventUpload').files[0],m=$('uploadEventMsg');if(f&&f.size>5*1024*1024){m.textContent='الصورة أكبر من 5 ميجابايت. يرجى ضغطها قبل الرفع.';return}if(!f){m.textContent='اختر صورة أولًا';return}m.textContent='جارٍ الرفع...';const ext=(f.name.split('.').pop()||'jpg').toLowerCase();const path='events/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;const {error}=await supabaseClient.storage.from('site-media').upload(path,f,{upsert:false,contentType:f.type||'image/jpeg'});if(error){m.textContent='تعذر الرفع: '+error.message;return}const {data}=supabaseClient.storage.from('site-media').getPublicUrl(path);const url=data.publicUrl;document.querySelector('#editor [data-k=cover_url]').value=url;const mediaResult=await supabaseClient.from('media').insert({url,storage_path:path,title:f.name,alt_text:document.querySelector('#editor [data-k=title_ar]')?.value||'صورة فعالية',category:'events'});m.textContent=mediaResult.error?'تم رفع الصورة وتعيين رابطها، لكن لم تسجل في المكتبة: '+mediaResult.error.message:'تم رفع الصورة وتعيين رابطها. اضغط حفظ الفعالية لتثبيت البيانات.';await loadEventMedia()}}
 if(tab==='sliders'){const sel=$('mediaSelect'),img=$('mediaPreview'),urlInput=document.querySelector('[data-k="image_url"]');const sync=url=>{if(!url){img.style.display='none';return}img.src=url;img.style.display='block'};if(view.image_url){sel.value=view.image_url;sync(view.image_url)}sel.onchange=()=>{if(sel.value){urlInput.value=sel.value;sync(sel.value)}};urlInput.oninput=()=>sync(urlInput.value)}
 $('save').onclick=()=>save(x.id);if(x.id)$('cancel').onclick=()=>renderForm()}
async function load(){const d=defs[tab];$('list').innerHTML='<div class="state">جارٍ التحميل...</div>';let q=supabaseClient.from(d.table).select('*');if(d.order)q=q.order(d.order,{ascending:true});const {data,error}=await q.limit(300);if(error){$('list').innerHTML='<div class="state">تعذر تحميل البيانات. تحقق من إعدادات Supabase ثم أعد المحاولة.</div>';return}rows=data||[];$('list').innerHTML=rows.map(x=>`<div class="row"><div class="row-main">${(x.image_url||x.cover_url)?`<img class="thumb" src="${esc(x.image_url||x.cover_url)}" alt="">`:''}<div><strong>${esc(x.title_ar||x.label_ar||x.platform||x.day_key||'عنصر')}</strong><small>${esc(x.description_ar||x.url||x.video_url||'')}</small>${x.is_published===false?'<small>مخفي عن الموقع</small>':''}</div></div><div class="actions">${tab==='events'?`<button class="btn ${x.is_published?'primary':'secondary'}" onclick="toggleEvent('${x.id}',${x.is_published===true})">${x.is_published?'ظاهر ✓':'مخفي'}</button>`:''}<button class="btn secondary" onclick="edit('${x.id}')">تعديل</button><button class="btn danger" onclick="del('${x.id}')">حذف</button></div></div>`).join('')||'<div class="state">لا توجد بيانات بعد.</div>'}
function collect(){const obj={};document.querySelectorAll('#editor [data-k]').forEach(el=>{let v=el.type==='checkbox'?el.checked:el.value.trim();if(el.type==='number')v=v===''?0:Number(v);if(['time','date','datetime-local'].includes(el.type)&&v==='')v=null;obj[el.dataset.k]=v});return obj}
async function write(table,id,obj){return id?await supabaseClient.from(table).update(obj).eq('id',id).select('id'):await supabaseClient.from(table).insert(obj).select('id')}
async function save(id){const d=defs[tab],obj=collect();$('msg').className='';$('msg').textContent='جارٍ الحفظ...';let r;if(tab==='sliders'){const buttonText=obj._button_text||'',buttonUrl=obj._button_url||'';delete obj._button_text;delete obj._button_url;let modern={...obj,button_text_ar:buttonText,button_url:buttonUrl};r=await write(d.table,id,modern);if(r.error&&/button_text_ar|button_url|schema cache|column/i.test(r.error.message||'')){let legacy={...obj,cta_ar:buttonText,target_url:buttonUrl};r=await write(d.table,id,legacy)}}else {if(tab==='events'){if(!obj.title_ar){$('msg').textContent='أدخل اسم الفعالية أولًا';return}if(!obj.event_date)delete obj.event_date;if(!obj.status)delete obj.status;}r=await write(d.table,id,obj)}if(r.error||!r.data?.length){$('msg').className='error';$('msg').textContent='تعذر الحفظ: '+(r.error?.message||'لم يؤكد الخادم العملية؛ تحقق من صلاحيات RLS');return}$('msg').className='success';$('msg').textContent='تم الحفظ وسيظهر التغيير في الموقع.';renderForm();load()}
window.toggleEvent=async(id,current)=>{const {data,error}=await supabaseClient.from('events').update({is_published:!current}).eq('id',id).select('id');if(error||!data?.length){alert('تعذر تغيير ظهور الفعالية: '+(error?.message||'لم يؤكد الخادم التغيير'));return}await load()};window.edit=id=>{const x=rows.find(r=>String(r.id)===String(id));if(x)renderForm(x)};window.del=async id=>{if(!confirm('هل تريد حذف هذا العنصر؟'))return;const {error}=await supabaseClient.from(defs[tab].table).delete().eq('id',id);if(error)alert('تعذر الحذف: '+error.message);else load()};$('tabs').onclick=async e=>{if(e.target.dataset.tab){tab=e.target.dataset.tab;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='sliders')await loadSliderMedia();if(tab==='events')await loadEventMedia();renderForm();load()}};init();
</script><script src="phase24.js?v=24" defer></script><script src="phase31.js?v=31" defer></script><script defer src="phase32.js?v=32"></script><script src="phase46-admin-tools.js?v=46"></script></body></html>
