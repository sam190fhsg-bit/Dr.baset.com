<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مكتبة الوسائط | إدارة العيادة</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="site-theme.css"><link rel="stylesheet" href="site-enhancements.css"><style>
:root{--g:#4c963d;--b:#064b7c;--bg:#f4f8fa;--bd:#dfe9ed}*{box-sizing:border-box}body{font-family:Tahoma,Arial;background:var(--bg);margin:0;color:#18313f}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.box{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 8px 24px rgba(0,50,75,.05)}.form{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.form input,.form select,.toolbar input,.toolbar select{width:100%;padding:12px;border:1px solid #d7e3e8;border-radius:10px;background:#fff}.btn{padding:11px 16px;border:0;border-radius:10px;cursor:pointer;font-weight:700}.primary{background:var(--g);color:#fff}.secondary{background:#eaf3f7;color:var(--b)}.danger{background:#fff0f0;color:#a32727}.toolbar{display:grid;grid-template-columns:2fr 1fr auto;gap:10px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.item{background:#fff;border:1px solid var(--bd);border-radius:14px;overflow:hidden}.item img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#eef3f5}.meta{padding:11px}.meta strong,.meta small{display:block;overflow-wrap:anywhere}.actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.actions .btn{padding:7px 9px;font-size:12px}.state{text-align:center;padding:28px;color:#607782}.badge{display:inline-block;background:#edf6ea;color:#39792f;padding:4px 8px;border-radius:20px;font-size:12px;margin-top:5px}.preview{max-width:130px;max-height:100px;border-radius:10px;display:none;margin-top:8px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.form,.toolbar{grid-template-columns:1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}.wrap{padding:14px}}</style></head><body><main class="wrap"><div class="top"><div><h1>مكتبة الوسائط</h1><p>رفع وتنظيم واستبدال صور الموقع من Supabase Storage.</p></div><a class="btn secondary" href="admin.html">العودة للوحة الإدارة</a></div><div id="gate" class="box">جارٍ التحقق من الحساب والصلاحية...</div><section id="app" hidden><div class="box"><h2>إضافة صورة</h2><div class="form"><div><input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/avif"><img id="preview" class="preview" alt="معاينة"></div><input id="title" placeholder="عنوان الصورة"><input id="alt" placeholder="النص البديل ALT"><select id="category"><option value="general">عام</option><option value="slider">السلايدر</option><option value="doctor">الطبيب</option><option value="internal-medicine">الباطنة</option><option value="liver">الكبد</option><option value="gastroenterology">الجهاز الهضمي</option><option value="endoscopy">المناظير</option><option value="diseases">الحالات المرضية</option><option value="services">الخدمات</option><option value="articles">المقالات</option><option value="events">الفعاليات</option><option value="gallery">المعرض</option></select><input id="caption" placeholder="وصف/تعليق اختياري"><select id="linkedType"><option value="">بدون ربط مباشر</option><option value="disease">حالة مرضية</option><option value="service">خدمة</option><option value="slider">سلايدر</option><option value="article">مقال</option><option value="event">فعالية</option></select><select id="linkedItem" disabled><option value="">اختر العنصر...</option></select><button id="upload" class="btn primary">رفع وحفظ الصورة</button></div><p id="status" aria-live="polite"></p></div><div class="box"><div class="toolbar"><input id="search" placeholder="بحث بالعنوان أو ALT..."><select id="filter"><option value="">كل التصنيفات</option></select><button id="refresh" class="btn secondary">تحديث</button></div></div><div id="grid" class="grid"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const $=id=>document.getElementById(id),gate=$('gate'),app=$('app'),grid=$('grid'),statusEl=$('status');let rows=[],linkRows=[];
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function init(){const {data:{session},error:sessionError}=await supabaseClient.auth.getSession();if(sessionError||!session){gate.innerHTML='يجب <a href="admin.html">تسجيل الدخول</a> أولًا.';return}const {data:allowed,error:permError}=await supabaseClient.rpc('is_content_editor');if(permError){console.error('Media permission check failed:',permError);gate.innerHTML='تعذر التحقق من صلاحية إدارة الوسائط. <button class="btn secondary" onclick="init()">إعادة المحاولة</button>';return}if(allowed!==true){gate.textContent='الحساب مسجل الدخول لكنه لا يملك صلاحية إدارة الوسائط.';return}gate.hidden=true;app.hidden=false;await load();$('linkedType').onchange=loadLinkedItems}

async function loadLinkedItems(){const type=$('linkedType').value,sel=$('linkedItem');sel.innerHTML='<option value="">اختر العنصر...</option>';sel.disabled=true;linkRows=[];if(!type)return;const map={disease:['diseases','title_ar','slug'],service:['services','title_ar','slug'],slider:['sliders','title_ar','id'],article:['articles','title_ar','slug'],event:['events','title_ar','id']};const cfg=map[type];if(!cfg)return;const {data,error}=await supabaseClient.from(cfg[0]).select(`id,${cfg[1]},${cfg[2]}`).limit(300);if(error){statusEl.textContent='تعذر تحميل عناصر الربط، ويمكن رفع الصورة بدون ربط.';return}linkRows=data||[];sel.innerHTML='<option value="">اختر العنصر...</option>'+linkRows.map(x=>`<option value="${esc(x.id)}">${esc(x[cfg[1]]||x[cfg[2]]||x.id)}</option>`).join('');sel.disabled=false}

async function load(){grid.innerHTML='<div class="state">جارٍ تحميل الوسائط...</div>';const {data,error}=await supabaseClient.from('media').select('*').is('deleted_at',null).order('created_at',{ascending:false}).limit(200);if(error){grid.innerHTML='<div class="state">تعذر تحميل الوسائط. <button class="btn secondary" onclick="load()">إعادة المحاولة</button></div>';return}rows=data||[];const cats=[...new Set(rows.map(x=>x.category).filter(Boolean))];$('filter').innerHTML='<option value="">كل التصنيفات</option>'+cats.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');render()}
function render(){const q=$('search').value.trim().toLowerCase(),cat=$('filter').value;const list=rows.filter(x=>(!cat||x.category===cat)&&(!q||`${x.title||''} ${x.alt_text||''} ${x.caption||''}`.toLowerCase().includes(q)));grid.innerHTML=list.map(x=>`<article class="item"><img loading="lazy" src="${esc(x.url)}" alt="${esc(x.alt_text||'')}"><div class="meta"><strong>${esc(x.title||x.alt_text||'بدون عنوان')}</strong><small>${esc(x.alt_text||'ALT غير مضاف')}</small><span class="badge">${esc(x.category||'general')}</span><div class="actions"><button class="btn secondary" onclick="editMeta('${x.id}')">تعديل البيانات</button><button class="btn danger" onclick="trash('${x.id}')">نقل للسلة</button></div></div></article>`).join('')||'<div class="state">لا توجد صور مطابقة.</div>'}
$('file').onchange=()=>{const f=$('file').files[0];if(!f){$('preview').style.display='none';return} $('preview').src=URL.createObjectURL(f);$('preview').style.display='block'};
$('upload').onclick=async()=>{const f=$('file').files[0];if(!f){statusEl.textContent='اختر صورة أولًا.';return}if(f.size>5*1024*1024){statusEl.textContent='الحد الأقصى للصورة 5MB.';return}if(!['image/jpeg','image/png','image/webp','image/avif'].includes(f.type)){statusEl.textContent='صيغة الصورة غير مدعومة.';return}statusEl.textContent='جارٍ الرفع والحفظ...';$('upload').disabled=true;try{const ext=(f.name.split('.').pop()||'webp').toLowerCase();const path=`${$('category').value}/${Date.now()}-${crypto.randomUUID()}.${ext}`;const {error:e}=await supabaseClient.storage.from('site-media').upload(path,f,{upsert:false,contentType:f.type,cacheControl:'31536000'});if(e)throw e;const {data:u}=supabaseClient.storage.from('site-media').getPublicUrl(path);const {data:{user}}=await supabaseClient.auth.getUser();const linkedType=$('linkedType').value||null,linkedId=$('linkedItem').value||null;const {error:e2}=await supabaseClient.from('media').insert({url:u.publicUrl,storage_path:path,title:$('title').value.trim(),alt_text:$('alt').value.trim(),caption:$('caption').value.trim(),category:$('category').value,mime_type:f.type,size_bytes:f.size,linked_type:linkedType,linked_id:linkedId,created_by:user.id,updated_by:user.id});if(e2){await supabaseClient.storage.from('site-media').remove([path]);throw e2}statusEl.textContent='تم رفع الصورة وحفظ بياناتها بنجاح.';$('file').value='';$('title').value='';$('alt').value='';$('caption').value='';$('linkedType').value='';$('linkedItem').innerHTML='<option value="">اختر العنصر...</option>';$('linkedItem').disabled=true;$('preview').style.display='none';await load()}catch(e){statusEl.textContent='تعذر إكمال الرفع. تحقق من صلاحية الحساب وسياسات Storage.'}finally{$('upload').disabled=false}};
window.editMeta=async id=>{const x=rows.find(r=>r.id===id);if(!x)return;const title=prompt('عنوان الصورة:',x.title||'');if(title===null)return;const alt=prompt('النص البديل ALT:',x.alt_text||'');if(alt===null)return;const caption=prompt('الوصف:',x.caption||'');if(caption===null)return;const {data:{user}}=await supabaseClient.auth.getUser();const {error}=await supabaseClient.from('media').update({title:title.trim(),alt_text:alt.trim(),caption:caption.trim(),updated_at:new Date().toISOString(),updated_by:user.id}).eq('id',id);if(error)alert('تعذر حفظ التعديل.');else load()};
window.trash=async id=>{if(!confirm('نقل الصورة إلى السلة؟ لن يتم حذف ملف Storage الآن.'))return;const {data:{user}}=await supabaseClient.auth.getUser();const {error}=await supabaseClient.from('media').update({deleted_at:new Date().toISOString(),updated_by:user.id}).eq('id',id);if(error)alert('تعذر نقل الصورة للسلة.');else load()};
$('search').oninput=render;$('filter').onchange=render;$('refresh').onclick=load;init();
</script></body></html>
