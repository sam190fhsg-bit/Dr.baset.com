<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مكتبة الوسائط</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="site-theme.css"><link rel="stylesheet" href="site-enhancements.css"><style>body{font-family:Tahoma,Arial;background:#f5f8f9}.wrap{max-width:1000px;margin:40px auto;padding:20px}.box{background:#fff;border:1px solid #e1eaed;border-radius:18px;padding:22px}.box input,.box select{width:100%;padding:11px;margin:7px 0;border:1px solid #dbe5e9;border-radius:9px}.box button{padding:11px 17px;background:#4c963d;color:#fff;border:0;border-radius:9px}.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.item{background:#fff;border:1px solid #e1eaed;border-radius:12px;padding:10px}.item img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px}@media(max-width:700px){.media-grid{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><h1>مكتبة الوسائط</h1><div id="gate" class="box">جارٍ التحقق من الصلاحية...</div><div id="app" hidden><div class="box"><label>الصورة</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/avif"><input id="alt" placeholder="النص البديل ALT"><select id="category"><option>general</option><option>doctor</option><option>slider</option><option>internal-medicine</option><option>liver</option><option>gastroenterology</option><option>endoscopy</option><option>articles</option><option>events</option></select><button id="upload">رفع الصورة</button><p id="status"></p></div><div id="grid" class="media-grid"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const gate=document.getElementById('gate'),app=document.getElementById('app'),statusEl=document.getElementById('status'),grid=document.getElementById('grid');async function init(){const {data}=await supabaseClient.auth.getSession();if(!data.session){gate.innerHTML='يجب <a href="admin.html">تسجيل الدخول</a> أولًا.';return}gate.hidden=true;app.hidden=false;load()}async function load(){const {data,error}=await supabaseClient.from('media').select('id,url,alt_text,category,created_at').is('deleted_at',null).order('created_at',{ascending:false}).limit(60);if(error){grid.innerHTML='<div class="state-box">تعذر تحميل الوسائط.</div>';return}grid.innerHTML=(data||[]).map(x=>`<div class="item"><img loading="lazy" src="${x.url}" alt="${x.alt_text||''}"><strong>${x.alt_text||'بدون عنوان'}</strong><small>${x.category||''}</small></div>`).join('')||'<div class="state-box">لا توجد وسائط منشورة.</div>'}upload.onclick=async()=>{const f=file.files[0];if(!f){statusEl.textContent='اختر صورة أولًا.';return}if(f.size>5*1024*1024){statusEl.textContent='حجم الصورة أكبر من 5MB.';return}statusEl.textContent='جارٍ الرفع...';const ext=f.name.split('.').pop().toLowerCase();const name=`${category.value}/${Date.now()}-${crypto.randomUUID()}.${ext}`;const {error}=await supabaseClient.storage.from('site-media').upload(name,f,{upsert:false,contentType:f.type});if(error){statusEl.textContent='تعذر رفع الصورة.';return}const {data:u}=supabaseClient.storage.from('site-media').getPublicUrl(name);const {error:e2}=await supabaseClient.from('media').insert({url:u.publicUrl,storage_path:name,alt_text:alt.value.trim(),category:category.value});statusEl.textContent=e2?'تم رفع الملف لكن تعذر تسجيل بياناته.':'تم رفع الصورة بنجاح.';if(!e2){file.value='';alt.value='';load()}};init()</script></body></html>
