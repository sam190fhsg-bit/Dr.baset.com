<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إظهار وإخفاء الصفحات</title><style>body{margin:0;background:#f3f7f5;color:#173d3b;font:15px Tahoma,Arial}.wrap{max-width:1050px;margin:auto;padding:18px}.top,.card{background:#fff;border:1px solid #e2ebe5;border-radius:14px;padding:18px;margin-bottom:14px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}a{color:#17638a}.row{display:grid;grid-template-columns:1fr auto auto;gap:18px;align-items:center;padding:15px 5px;border-bottom:1px solid #edf1ee}.row:last-child{border:0}.title{font-weight:bold}.path{font-size:12px;color:#6d7772;margin-top:5px}.switch{display:flex;align-items:center;gap:7px;white-space:nowrap}input[type=checkbox]{width:22px;height:22px;accent-color:#4c963d}.state{padding:12px;border-radius:9px;background:#f5f9f6}.ok{color:#28772e}.err{color:#a22}@media(max-width:650px){.row{grid-template-columns:1fr 1fr}.row>div:first-child{grid-column:1/-1}}</style></head><body><main class="wrap"><div class="top"><div><h1>إظهار وإخفاء الصفحات الداخلية</h1><p>الإخفاء لا يحذف الصفحة أو محتواها. ويمكن إخفاء رابط الصفحة من القوائم مع إبقاء الرابط المباشر فعالًا.</p></div><a href="admin.html">العودة للوحة الإدارة</a></div><div id="gate" class="card">جارٍ التحقق من الصلاحية...</div><section id="app" class="card" hidden><div id="msg" class="state">جارٍ تحميل الصفحات...</div><div id="list"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const $=x=>document.getElementById(x);let rows=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function draw(){ $('list').innerHTML=rows.map((x,i)=>`<div class="row"><div><div class="title">${esc(x.title_ar||x.page_path)}</div><div class="path">${esc(x.page_path)}</div></div><label class="switch"><input type="checkbox" ${x.is_visible?'checked':''} onchange="setv(${i},'is_visible',this.checked)"> الصفحة ظاهرة</label><label class="switch"><input type="checkbox" ${x.show_in_navigation?'checked':''} onchange="setv(${i},'show_in_navigation',this.checked)"> الرابط ظاهر بالقوائم</label></div>`).join('');$('msg').textContent='يتم الحفظ مباشرة عند تغيير أي خيار.';$('msg').className='state ok'}
async function load(){const {data,error}=await supabaseClient.from('page_visibility').select('*').order('title_ar');if(error){$('msg').textContent='تعذر التحميل: '+error.message;$('msg').className='state err';return}rows=data||[];draw()}
window.setv=async(i,k,v)=>{const x=rows[i],old=x[k];x[k]=v;$('msg').textContent='جارٍ الحفظ...';const {data,error}=await supabaseClient.from('page_visibility').update({[k]:v,updated_at:new Date().toISOString()}).eq('page_path',x.page_path).select('page_path');if(error||!data?.length){x[k]=old;draw();$('msg').textContent='تعذر الحفظ: '+(error?.message||'تحقق من صلاحيات RLS');$('msg').className='state err'}else{$('msg').textContent='تم الحفظ.';$('msg').className='state ok'}};
(async()=>{const {data:{session}}=await supabaseClient.auth.getSession();if(!session){location.href='admin.html';return}const {data:ok,error}=await supabaseClient.rpc('is_content_editor');if(error||ok!==true){$('gate').textContent='لا توجد صلاحية لإدارة الصفحات.';return}$('gate').hidden=true;$('app').hidden=false;load()})();
</script></body></html>
